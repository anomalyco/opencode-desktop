[package]
name = "opencode-feature-office"
version = "0.0.1"
description = "Word, Excel and PowerPoint previews for Rune apps: worker threads, Vello GPU compositor, page viewer and interactive spreadsheet grid"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
browser-policy = { path = "../../crates/browser-policy" }
bytemuck = { version = "1", features = ["derive"] }
office-preview = { path = "../../crates/office-preview" }
opencode-kernel = { path = "../../crates/opencode-kernel" }
opencode-ui = { path = "../../crates/opencode-ui" }
rune.workspace = true
rune-theme-opencode.workspace = true
vello = { version = "0.11", default-features = false, features = ["wgpu"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { workspace = true, features = ["rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ureq-web = { path = "../../crates/ureq-web" }

[lints]
workspace = true
