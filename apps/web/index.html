<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>OpenCode (Rune)</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; }
  body { font: 13px/18px system-ui, sans-serif; background: Canvas; color: CanvasText; }
  #connect { display: none; max-width: 360px; margin: 96px auto; padding: 16px; border: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
  #connect h1 { font-size: 13px; font-weight: 600; margin: 0 0 12px; }
  #connect label { display: block; margin: 8px 0 4px; color: color-mix(in srgb, CanvasText 60%, transparent); }
  #connect input { box-sizing: border-box; width: 100%; height: 28px; padding: 0 8px; font: 11px/16px ui-monospace, monospace; border: 1px solid color-mix(in srgb, CanvasText 20%, transparent); border-radius: 0; background: Canvas; color: CanvasText; }
  #connect button { margin-top: 12px; height: 28px; padding: 0 12px; font: inherit; border: 1px solid #009fff; border-radius: 0; background: #009fff; color: #fff; cursor: pointer; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; color: color-mix(in srgb, CanvasText 60%, transparent); pointer-events: none; }
</style>
<form id="connect">
  <h1>Connect to an OpenCode server</h1>
  <label for="server">Server URL</label>
  <input id="server" name="server" placeholder="http://127.0.0.1:4096" required>
  <label for="password">Password (if it has one)</label>
  <input id="password" name="password" type="password" autocomplete="off">
  <button type="submit">Connect</button>
</form>
<div id="status"></div>
<script type="module">
  const params = new URLSearchParams(location.search);
  const status = document.querySelector('#status');
  if (!params.has('server')) {
    // The page never guesses a server: it asks, then reloads with `?server=`.
    document.querySelector('#connect').style.display = 'block';
  } else {
    status.textContent = 'Loading…';
    try {
      if (!navigator.gpu) throw new Error('This page needs WebGPU: use a current Chrome or Edge.');
      const { default: init } = await import('./app.js');
      await init();
      status.remove();
    } catch (error) {
      status.textContent = String(error);
      console.error(error);
    }
  }
</script>
</html>
