[package]
name = "opencode-desktop"
version = "0.0.1"
edition.workspace = true
license.workspace = true

[features]
hot = ["rune/hot"]

[dependencies]
mac-app = { path = "../../crates/mac-app" }
opencode-kit = { path = "../../crates/opencode-kit" }
rune = { workspace = true, features = ["native-file-dialog"] }
rune-kit = { workspace = true, features = ["markdown", "mermaid"] }
rune-theme-opencode.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"

[dev-dependencies]
png = "0.18"
rune = { workspace = true, features = ["frame-profile"] }
procwatch.workspace = true
