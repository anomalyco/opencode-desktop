[package]
name = "opencode-desktop"
version = "0.0.1"
edition.workspace = true
license.workspace = true

[features]
default = ["knobs"]
hot = ["rune/hot"]
# The ⌘⇧K tuning layer.
knobs = ["rune-knobs/panel"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
mac-app = { path = "../../crates/mac-app" }
opencode-kit = { path = "../../crates/opencode-kit" }
project-icon = { path = "../../crates/project-icon" }
rune-knobs = { path = "../../crates/rune-knobs" }
rune = { workspace = true, features = ["native-file-dialog"] }
rune-kit = { workspace = true, features = ["markdown", "mermaid"] }
rune-theme-opencode.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"

[dev-dependencies]
png = "0.18"
rune = { workspace = true, features = ["frame-profile"] }
procwatch.workspace = true
