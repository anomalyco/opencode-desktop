[package]
name = "opencode-desktop"
version = "0.0.1"
description = "OpenCode (Rune), the native Rune desktop client for OpenCode"
edition.workspace = true
license.workspace = true

[features]
default = ["knobs", "office", "stories"]
# Word, Excel and PowerPoint previews (`office`): BetterOffice's engines and Vello, which draws
# their display lists on the GPU. About 6 MB of font packs and the engines; a build without it
# shows Office files as binary.
office = ["dep:office-preview", "dep:opencode-feature-office"]
# Standalone storybook modules under `stories/{composer,shell,timeline}/`.
stories = []
# The embedded browser's engine. Enabled on macOS, Windows and Linux x86_64 below.
browser = ["browser-pane/engine"]
# Harness builds: the browser engine install's injected faults (OPENCODE_BROWSER_FAULT_DISK_FULL).
browser-faults = ["browser-pane/faults"]
hot = ["rune/hot"]
# Measuring builds: heap dumps by allocation site, with the GPU's allocations, each plugin VM's
# Luau heap and SQLite's (procwatch `alloc-sites`).
alloc-sites = ["procwatch/alloc-sites", "rune/alloc-sites"]
# Per-frame stage timings for a live window, written to RUNE_FRAME_LOG (a diagnostic build).
frame-profile = ["rune/frame-profile"]
# The ⌘⇧K tuning layer.
knobs = ["rune-knobs/panel"]

[dependencies]
memchr = "2"
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
# The new-session Easter egg's pipelines (`egg/gpu.rs`): Rune's own wgpu, named for its types.
wgpu = { version = "30", default-features = false }
office-preview = { path = "../../crates/office-preview", optional = true }
opencode-code-view = { path = "../../crates/opencode-code-view" }
opencode-feature-annotations = { path = "../../features/annotations" }
opencode-feature-composer-input = { path = "../../features/composer-input" }
opencode-feature-connect = { path = "../../features/connect" }
opencode-feature-dictation = { path = "../../features/dictation" }
opencode-feature-egg = { path = "../../features/egg" }
opencode-feature-files = { path = "../../features/files" }
opencode-feature-find = { path = "../../features/find" }
opencode-feature-history = { path = "../../features/history" }
opencode-feature-inbox = { path = "../../features/inbox" }
opencode-feature-mcp = { path = "../../features/mcp" }
opencode-feature-mentions = { path = "../../features/mentions" }
opencode-feature-narrow = { path = "../../features/narrow" }
opencode-feature-notifications = { path = "../../features/notifications" }
opencode-feature-office = { path = "../../features/office", optional = true }
opencode-feature-open-in = { path = "../../features/open-in" }
opencode-feature-panels = { path = "../../features/panels" }
opencode-feature-projects = { path = "../../features/projects" }
opencode-feature-restore = { path = "../../features/restore" }
opencode-feature-review = { path = "../../features/review" }
opencode-feature-session-menu = { path = "../../features/session-menu" }
opencode-feature-settings = { path = "../../features/settings" }
opencode-feature-subagents = { path = "../../features/subagents" }
opencode-feature-switcher = { path = "../../features/switcher" }
opencode-feature-terminal-surface = { path = "../../features/terminal-surface" }
opencode-feature-timeline-extras = { path = "../../features/timeline-extras" }
opencode-feature-tips = { path = "../../features/tips" }
opencode-feature-updater = { path = "../../features/updater" }
opencode-feature-usage = { path = "../../features/usage" }
opencode-feature-workspace-tools = { path = "../../features/workspace-tools" }
opencode-kernel = { path = "../../crates/opencode-kernel" }
opencode-platform = { path = "../../crates/opencode-platform" }
browser-pane = { path = "../../crates/browser-pane" }
crc32fast = "1"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
hex-client = { path = "../../crates/hex-client" }
notify = "8"
rune-mac.workspace = true
rune-notify.workspace = true
opencode-i18n = { path = "../../crates/opencode-i18n" }
opencode-kit = { path = "../../crates/opencode-kit" }
opencode-runtime = { path = "../../crates/opencode-runtime" }
opencode-search = { path = "../../crates/opencode-search" }
opencode-storage = { path = "../../crates/opencode-storage" }
opencode-ui = { path = "../../crates/opencode-ui" }
opencode-plugin-runtime = { path = "../../crates/opencode-plugin-runtime" }
opencode-plugin-spec = { path = "../../crates/opencode-plugin-spec" }
otlp-lite = { path = "../../crates/otlp-lite" }
project-icon = { path = "../../crates/project-icon" }
procwatch.workspace = true
# Random ids and passwords for plugins (System:RandomId, the askpass token).
getrandom = "0.3"
rune-knobs.workspace = true
rune-parts = { path = "../../crates/rune-parts", features = ["view"] }
# The plugins (`plugin_host`), run on Luau. mlua is rune-luau's own, named here for the bindings.
rune-luau = { workspace = true, features = ["serde"] }
mimalloc = { version = "0.1", default-features = false }
mlua = { git = "https://github.com/mlua-rs/mlua", rev = "a0ad4535fc72ba89967a931c5be57b162b5f0f3f", features = ["luau"] }
rune-perf.workspace = true
rune-register.workspace = true
rune = { workspace = true, features = ["native-file-dialog", "metal-backend", "avif"] }
rune-kit = { workspace = true, features = ["markdown", "mermaid"] }
rune-theme-opencode.workspace = true
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
session-view = { path = "../../crates/session-view" }
terminal = { path = "../../crates/terminal" }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "serde"] }
ureq = { workspace = true, features = ["rustls"] }
# The build's identity everywhere; its install, uninstall and update registration on Windows.
win-install = { path = "../../crates/win-install" }

# Rune's agent tooling (`--snap`, `--tree`, `--script`, `--html`, ...) in release builds too, as before Rune #834:
# the harnesses run release builds. Not in a page, where it would only add to the module.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rune = { workspace = true, features = ["tooling"] }

[target.'cfg(target_os = "macos")'.dependencies]
browser-pane = { path = "../../crates/browser-pane", features = ["engine"] }
# Ogg and Opus audio tracks in videos, which AVPlayer can't play (Rune decodes them).
rune = { workspace = true, features = ["ogg-audio"] }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
browser-pane = { path = "../../crates/browser-pane", features = ["engine"] }

[target.'cfg(target_os = "windows")'.dependencies]
# The egg's sound stream (`egg/sound/wasapi.rs`): the same build of `windows` Rune's video sound uses.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Threading"] }
authenticode = { path = "../../crates/authenticode" }
browser-pane = { path = "../../crates/browser-pane", features = ["engine"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_System_Console", "Win32_System_Diagnostics", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
# The exe's icon, version and manifest resources on Windows.
win-install = { path = "../../crates/win-install", features = ["resources"] }
# The built-in plugins' Luau compiled to bytecode at build time (`build.rs`), with rune-luau's mlua.
mlua = { git = "https://github.com/mlua-rs/mlua", rev = "a0ad4535fc72ba89967a931c5be57b162b5f0f3f", features = ["luau"] }
# The built-in plugins' `locales/*.json`, read into one table each at build time.
serde_json.workspace = true

[lints]
workspace = true
