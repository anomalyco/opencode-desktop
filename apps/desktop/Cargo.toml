[package]
name = "opencode-desktop"
version = "0.0.1"
description = "OpenCode (Rune), the native Rune desktop client for OpenCode"
edition.workspace = true
license.workspace = true

[features]
default = ["knobs"]
# The embedded browser's engine. Always on for macOS and Windows (see the target dependencies below).
browser = ["browser-pane/engine"]
hot = ["rune/hot"]
# Rune's per-phase frame timings, for the CPU benchmarks in `perf.rs` and the `*bench*` test
# modules only: `cargo test --profile perf --features frame-profile ... -- --ignored`. Off in
# every other build, so `cargo test` shares the `cargo build` Rune and ships no timers.
frame-profile = ["rune/frame-profile"]
# Built-in plugins linked into the binary through their own entry points, for headless and
# fuzzer builds; release builds ship them as libraries in `<app>/plugins/`. Each links its
# rlib (`plugins/<id>/impl`), never its cdylib, so the libraries keep their exports. The Hello
# test plugin is the tests' alone (a dev-dependency).
static-builtins = []
# The ⌘⇧K tuning layer.
knobs = ["rune-knobs/panel"]

[dependencies]
memchr = "2"
base64 = "0.22"
browser-pane = { path = "../../crates/browser-pane" }
crc32fast = "1"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
hex-client = { path = "../../crates/hex-client" }
# fuzzysort's accent folding (`mentions::fuzzysort`): NFD and the Latin script, already in the tree.
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
icu_properties = "2"
libloading = "0.8"
notify = "8"
rune-mac.workspace = true
rune-notify.workspace = true
opencode-i18n = { path = "../../crates/opencode-i18n" }
opencode-kit = { path = "../../crates/opencode-kit" }
opencode-plugin = { path = "../../crates/opencode-plugin" }
opencode-plugin-spec = { path = "../../crates/opencode-plugin-spec" }
otlp-lite = { path = "../../crates/otlp-lite" }
project-icon = { path = "../../crates/project-icon" }
procwatch.workspace = true
# The pairing QR code's encoder (Qr service), without its image or SVG renderers.
qrcode = { version = "0.14", default-features = false }
# Random ids and passwords for plugins (System:RandomId, the askpass token).
getrandom = "0.3"
rune-knobs.workspace = true
rune-parts = { path = "../../crates/rune-parts", features = ["view"] }
# Luau plugins (`plugin_host::luau`). mlua is rune-luau's own, named here for the bindings.
rune-luau = { workspace = true, features = ["serde"] }
mimalloc = { version = "0.1", default-features = false }
mlua = { git = "https://github.com/mlua-rs/mlua", rev = "a0ad4535fc72ba89967a931c5be57b162b5f0f3f", features = ["luau"] }
rune-perf.workspace = true
rune-register.workspace = true
rune = { workspace = true, features = ["native-file-dialog", "metal-backend", "avif"] }
rune-kit = { workspace = true, features = ["markdown", "mermaid"] }
rune-theme-opencode.workspace = true
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
session-view = { path = "../../crates/session-view" }
terminal = { path = "../../crates/terminal" }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "serde"] }
ureq = { workspace = true, features = ["rustls"] }
# The build's identity everywhere; its install, uninstall and update registration on Windows.
win-install = { path = "../../crates/win-install" }

[target.'cfg(target_os = "macos")'.dependencies]
browser-pane = { path = "../../crates/browser-pane", features = ["engine"] }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
browser-pane = { path = "../../crates/browser-pane", features = ["engine"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
# The exe's icon, version and manifest resources on Windows.
win-install = { path = "../../crates/win-install", features = ["resources"] }

[dev-dependencies]
# The built-ins the tests link in (`plugin_host::builtins`), so the motion gate covers what they draw.
opencode-plugin-hello-impl = { path = "../../plugins/hello/impl" }
png = "0.18"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[lints]
workspace = true
