[package]
name = "opencode-desktop"
version = "0.0.1"
description = "OpenCode (Rune), the native Rune desktop client for OpenCode"
edition.workspace = true
license.workspace = true

[features]
default = ["knobs", "office"]
# Word, Excel and PowerPoint previews (`office`): BetterOffice's engines and Vello, which draws
# their display lists on the GPU. About 6 MB of font packs and the engines; a build without it
# shows Office files as binary.
office = ["dep:office-preview", "dep:vello", "dep:bytemuck"]
# The embedded browser's engine. Always on for macOS and Windows (see the target dependencies below).
browser = ["browser-pane/engine"]
hot = ["rune/hot"]
# The ⌘⇧K tuning layer.
knobs = ["rune-knobs/panel"]

[dependencies]
memchr = "2"
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"], optional = true }
office-preview = { path = "../../crates/office-preview", optional = true }
vello = { version = "0.11", default-features = false, features = ["wgpu"], optional = true }
browser-pane = { path = "../../crates/browser-pane" }
crc32fast = "1"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
hex-client = { path = "../../crates/hex-client" }
# fuzzysort's accent folding (`mentions::fuzzysort`): NFD and the Latin script, already in the tree.
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
icu_properties = "2"
notify = "8"
rune-mac.workspace = true
rune-notify.workspace = true
opencode-i18n = { path = "../../crates/opencode-i18n" }
opencode-kit = { path = "../../crates/opencode-kit" }
opencode-storage = { path = "../../crates/opencode-storage" }
opencode-plugin-spec = { path = "../../crates/opencode-plugin-spec" }
otlp-lite = { path = "../../crates/otlp-lite" }
project-icon = { path = "../../crates/project-icon" }
procwatch.workspace = true
# The pairing QR code's encoder (Qr service), without its image or SVG renderers.
qrcode = { version = "0.14", default-features = false }
# Random ids and passwords for plugins (System:RandomId, the askpass token).
getrandom = "0.3"
rune-knobs.workspace = true
rune-parts = { path = "../../crates/rune-parts", features = ["view"] }
# The plugins (`plugin_host`), run on Luau. mlua is rune-luau's own, named here for the bindings.
rune-luau = { workspace = true, features = ["serde"] }
mimalloc = { version = "0.1", default-features = false }
mlua = { git = "https://github.com/mlua-rs/mlua", rev = "a0ad4535fc72ba89967a931c5be57b162b5f0f3f", features = ["luau"] }
rune-perf.workspace = true
rune-register.workspace = true
rune = { workspace = true, features = ["native-file-dialog", "metal-backend", "avif"] }
rune-kit = { workspace = true, features = ["markdown", "mermaid"] }
rune-theme-opencode.workspace = true
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
session-view = { path = "../../crates/session-view" }
terminal = { path = "../../crates/terminal" }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "serde"] }
ureq = { workspace = true, features = ["rustls"] }
# The build's identity everywhere; its install, uninstall and update registration on Windows.
win-install = { path = "../../crates/win-install" }

[target.'cfg(target_os = "macos")'.dependencies]
browser-pane = { path = "../../crates/browser-pane", features = ["engine"] }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
browser-pane = { path = "../../crates/browser-pane", features = ["engine"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_System_Console", "Win32_System_Diagnostics", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
# The exe's icon, version and manifest resources on Windows.
win-install = { path = "../../crates/win-install", features = ["resources"] }

[lints]
workspace = true
