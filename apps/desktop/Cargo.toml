[package]
name = "opencode-desktop"
version = "0.0.1"
description = "OpenCode (Rune), the native Rune desktop client for OpenCode"
edition.workspace = true
license.workspace = true

[features]
default = ["knobs"]
# The embedded browser's engine. Always on for macOS and Windows (see the target dependencies below).
browser = ["browser-pane/engine"]
hot = ["rune/hot"]
# Built-in plugins linked into the binary through their own entry points, for headless and
# fuzzer builds; release builds ship them as libraries in `<app>/plugins/`. Each links its
# rlib (`plugins/<id>/impl`), never its cdylib, so the libraries keep their exports.
static-builtins = ["dep:opencode-plugin-hello-impl", "dep:opencode-plugin-context-impl", "dep:opencode-plugin-details-impl", "dep:opencode-plugin-ssh-impl", "dep:opencode-plugin-wsl-impl", "dep:opencode-plugin-btw-impl", "dep:opencode-plugin-goal-impl", "dep:opencode-plugin-sources-impl", "dep:opencode-plugin-pairing-impl"]
# The ⌘⇧K tuning layer.
knobs = ["rune-knobs/panel"]

[dependencies]
base64 = "0.22"
browser-pane = { path = "../../crates/browser-pane" }
crc32fast = "1"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
hex-client = { path = "../../crates/hex-client" }
libloading = "0.8"
notify = "8"
rune-mac.workspace = true
rune-notify.workspace = true
opencode-kit = { path = "../../crates/opencode-kit" }
opencode-plugin = { path = "../../crates/opencode-plugin" }
opencode-plugin-context-impl = { path = "../../plugins/context/impl", optional = true }
opencode-plugin-details-impl = { path = "../../plugins/details/impl", optional = true }
opencode-plugin-hello-impl = { path = "../../plugins/hello/impl", optional = true }
opencode-plugin-ssh-impl = { path = "../../plugins/ssh/impl", optional = true }
opencode-plugin-wsl-impl = { path = "../../plugins/wsl/impl", optional = true }
opencode-plugin-pairing-impl = { path = "../../plugins/pairing/impl", optional = true }
opencode-plugin-sources-impl = { path = "../../plugins/sources/impl", optional = true }
opencode-plugin-goal-impl = { path = "../../plugins/goal/impl", optional = true }
opencode-plugin-btw-impl = { path = "../../plugins/btw/impl", optional = true }
otlp-lite = { path = "../../crates/otlp-lite" }
project-icon = { path = "../../crates/project-icon" }
procwatch.workspace = true
rune-knobs.workspace = true
rune-parts = { path = "../../crates/rune-parts", features = ["view"] }
rune-perf.workspace = true
rune-register.workspace = true
rune = { workspace = true, features = ["native-file-dialog", "metal-backend"] }
rune-kit = { workspace = true, features = ["markdown", "mermaid"] }
rune-theme-opencode.workspace = true
serde_json.workspace = true
sha2 = "0.10"
session-view = { path = "../../crates/session-view" }
terminal = { path = "../../crates/terminal" }
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
ureq = { workspace = true, features = ["rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
browser-pane = { path = "../../crates/browser-pane", features = ["engine"] }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
browser-pane = { path = "../../crates/browser-pane", features = ["engine"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
# The built-ins the tests link in (`plugin_host::builtins`), so the motion gate covers what they draw.
opencode-plugin-context-impl = { path = "../../plugins/context/impl" }
opencode-plugin-details-impl = { path = "../../plugins/details/impl" }
opencode-plugin-hello-impl = { path = "../../plugins/hello/impl" }
png = "0.18"
rune = { workspace = true, features = ["frame-profile"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[lints]
workspace = true
