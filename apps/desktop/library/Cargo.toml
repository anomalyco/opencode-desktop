[package]
name = "opencode-desktop-app"
version = "0.0.1"
description = "OpenCode (Rune) as a library in the macOS bundle's Frameworks, started by a small exe (apps/desktop/launcher): the system reads a new exe whole before its first run, and a bundle's libraries not"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "opencode_desktop_app"
path = "src/lib.rs"
crate-type = ["cdylib"]
test = false
doctest = false

[features]
# As `opencode-desktop`'s: the office engines in a library of their own.
office-library = ["opencode-desktop/office-library"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }
opencode-desktop = { path = ".." }
procwatch.workspace = true

[lints]
workspace = true