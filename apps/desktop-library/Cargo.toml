[package]
name = "opencode-desktop-library"
version = "0.0.1"
description = "OpenCode (Rune) as a library: what a packaged Windows build's exe (apps/desktop-thin) loads and runs"
edition.workspace = true
license.workspace = true

[lib]
name = "opencode_desktop_app"
path = "src/lib.rs"
crate-type = ["cdylib"]
test = false
doctest = false

# Windows alone packages the app this way; elsewhere the library is empty and links nothing.
[target.'cfg(target_os = "windows")'.dependencies]
mimalloc = { version = "0.1", default-features = false }
opencode-desktop = { path = "../desktop" }
procwatch.workspace = true

[lints]
workspace = true
