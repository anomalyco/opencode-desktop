[package]
name = "opencode-widget-view"
version = "0.0.1"
description = "Rune renderer for OpenCode agent widgets: draws an `opencode-widget` node tree with rune-kit's components and Kit tokens, with no session, window or desktop assumptions (embeddable on mobile through Rune's LayerHost)"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# The contract's types and lifecycle machine only: the host runs the steps.
opencode-widget = { path = "../opencode-widget", default-features = false, features = ["gpu"] }
rune = { workspace = true, default-features = false }
rune-kit = { workspace = true, default-features = false }
serde_json.workspace = true
# GPU canvases: their frames shown on the window's GPU (Rune's own wgpu).
wgpu = { version = "30", default-features = false }

# Live GPU canvases on Rune's Metal backend: replayed on a stock wgpu Metal device made on Rune's
# own MTLDevice (wgpu's validation), their textures shown through `rune_gpu::metal::texture_from_raw`.
[target.'cfg(target_os = "macos")'.dependencies]
rune-gpu = { git = "https://github.com/anomalyco/rune", rev = "be1c763842bce8166cc9a949c49c3dab6a2bc64e" }
objc2 = "0.6"
objc2-metal = "0.3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
opencode-widget = { path = "../opencode-widget", features = ["runner"] }
pollster = "1"
block2 = "0.6"

[lints]
workspace = true
