[package]
name = "net-trust"
version = "0.0.1"
description = "The certificate check every HTTPS request and WebSocket of the app uses: the operating system's, as a browser's"
edition.workspace = true
license.workspace = true
publish = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-platform-verifier = "0.7"
ureq = { workspace = true, features = ["rustls", "platform-verifier"] }

# A page's requests are the browser's own, with its own certificate check.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ureq-web = { path = "../ureq-web" }

[lints]
workspace = true
