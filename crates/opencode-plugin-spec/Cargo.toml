[package]
name = "opencode-plugin-spec"
version = "1.0.0"
description = "The engine-agnostic OpenCode plugin contract: contract.json, its codegen, and the host's Rust decoders"
edition.workspace = true
license.workspace = true

# `cargo run -p opencode-plugin-spec -- --write` regenerates every artifact from contract.json;
# `-- --check` fails when one has drifted.
[[bin]]
name = "opencode-plugin-spec"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true

[lints]
workspace = true
