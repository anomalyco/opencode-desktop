[package]
name = "opencode-widget"
version = "0.0.1"
description = "OpenCode agent widgets without UI: the node, event and step types of the widget contract, the per-widget lifecycle machine, and the PsychoScript step runner (pure Rust, embeddable on desktop and mobile)"
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["runner"]
# The step runner over the Rust PsychoScript (`Program`, `step_json`). Off, the crate is the contract's
# types and the lifecycle machine alone: what a renderer needs, without the interpreter.
runner = ["gpu", "dep:psychoscript", "dep:url", "dep:base64", "dep:ryu-js"]
# GPU canvases as a window shows them (`gpu`): the device live runs replay on and what their replay
# publishes for the compositor. Renderers enable it without the runner.
gpu = ["dep:wgpu", "dep:widget-gpu"]

[dependencies]
base64 = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# The `rust` branch of anomalyco/psychoscript: the Rust implementation, at parity with the TypeScript
# reference. Pure Rust (oxc, ICU4X), no platform dependencies, so it builds for iOS and Android too.
url = { version = "2", optional = true }
# `String(number)` as ECMAScript writes it, for a view key's path segment (widgets.md, Native hosts).
ryu-js = { version = "1", optional = true }
# At `mobile` 00a1d9e7, whose `psychoscript` is `rust` b30b1c2d's to the byte (the same tree): the
# one `widget-gpu` builds on, so both share one PsychoScript.
psychoscript = { git = "https://github.com/anomalyco/psychoscript", rev = "00a1d9e71a73c39e2eb0cbca3db12e35abfcf3f7", optional = true }
# GPU canvases' replay (`widgets-gpu.md`): checks and replays a live program's WebGPU batches on wgpu.
widget-gpu = { git = "https://github.com/anomalyco/psychoscript", rev = "00a1d9e71a73c39e2eb0cbca3db12e35abfcf3f7", optional = true }
wgpu = { version = "30", default-features = false, optional = true }

[dev-dependencies]
# The check programs read wire fixtures of 100-level views, deeper than serde_json reads by default.
serde_json = { workspace = true, features = ["unbounded_depth"] }
pollster = "1"

# The GPU checks replay on a real device: Vulkan here (lavapipe without a GPU), Metal on a Mac.
[target.'cfg(target_os = "linux")'.dev-dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan"] }
[target.'cfg(target_os = "macos")'.dev-dependencies]
wgpu = { version = "30", default-features = false, features = ["metal"] }

[lints]
workspace = true
