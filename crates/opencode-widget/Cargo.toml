[package]
name = "opencode-widget"
version = "0.0.1"
description = "OpenCode agent widgets without UI: the node, event and step types of the widget contract, the per-widget lifecycle machine, and the PsychoScript step runner (pure Rust, embeddable on desktop and mobile)"
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["runner"]
# The step runner over the Rust PsychoScript (`Program`, `step_json`). Off, the crate is the contract's
# types and the lifecycle machine alone: what a renderer needs, without the interpreter.
runner = ["gpu", "dep:psychoscript", "dep:url", "dep:base64"]
# GPU canvases as a window shows them (`gpu`): the device live runs replay on and what their replay
# publishes for the compositor. Renderers enable it without the runner.
gpu = ["dep:wgpu", "dep:psychoscript-gpu", "dep:widget-wire"]

[dependencies]
base64 = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
url = { version = "2", optional = true }
# `String(number)` as ECMAScript writes it, for a view key's path segment (widgets.md, Native hosts)
# and a table's number cells (widgets.md, Table).
ryu-js = "1"
# PsychoScript's Rust implementation, at parity with the TypeScript reference. Pure Rust (oxc,
# ICU4X), no platform dependencies, so it builds for iOS and Android too. From crates.io (0.1.2,
# PsychoScript `dev` 6403924), the one `widget-wire` builds on, so both share one.
psychoscript = { version = "0.1", optional = true }
# GPU canvases' replay (`widgets-gpu.md`): checks and replays a live program's WebGPU batches on wgpu.
# From crates.io (0.1.0, PsychoScript `dev` 2ef493f), as `widget-wire` takes it.
psychoscript-gpu = { version = "0.1", optional = true }
# The `wgsl` shorthand (`widget_wire::shorthand`): opencode `widgets` d8b0f68f's `packages/widgets-rs`.
widget-wire = { git = "https://github.com/anomalyco/opencode", rev = "d8b0f68fcb1bfbafd4f55f8c656321930267aa59", optional = true }
wgpu = { version = "30", default-features = false, optional = true }

[lints]
workspace = true
