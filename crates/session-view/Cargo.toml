[package]
name = "session-view"
version = "0.0.1"
description = "Embeddable OpenCode session timeline view for Rune apps"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
opencode-i18n = { path = "../opencode-i18n" }
opencode-kit = { path = "../opencode-kit" }
rune.workspace = true
rune-kit = { workspace = true, features = ["markdown", "mermaid"] }
rune-knobs.workspace = true
rune-parts = { path = "../rune-parts", features = ["view"] }
rune-theme-opencode.workspace = true
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"

[dev-dependencies]
rune = { workspace = true, features = ["metal-backend"] }
rune-knobs = { workspace = true, features = ["panel"] }

[features]
open-bench = ["rune/frame-profile"]

[[example]]
name = "open_bench"
required-features = ["open-bench"]

[lints]
workspace = true
