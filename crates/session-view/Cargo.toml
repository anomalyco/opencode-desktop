[package]
name = "session-view"
version = "0.0.1"
description = "Embeddable OpenCode session timeline view for Rune apps"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
opencode-kit = { path = "../opencode-kit" }
rune.workspace = true
rune-kit = { workspace = true, features = ["markdown", "mermaid"] }
rune-knobs.workspace = true
rune-parts = { path = "../rune-parts", features = ["view"] }
rune-theme-opencode.workspace = true
serde_json.workspace = true
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Time"] }

[dev-dependencies]
rune = { workspace = true, features = ["metal-backend"] }
rune-knobs = { workspace = true, features = ["panel"] }

[features]
open-bench = ["rune/frame-profile"]

[[example]]
name = "open_bench"
required-features = ["open-bench"]

[lints]
workspace = true
