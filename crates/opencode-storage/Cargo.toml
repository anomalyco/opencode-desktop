[package]
name = "opencode-storage"
version = "0.0.1"
description = "OpenCode desktop persistence: one SQLite database (native) or browser storage (wasm32), read from memory, written behind"
edition.workspace = true
license.workspace = true

[dependencies]
rune.workspace = true
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }
indexmap = "2"
sha2 = "0.10"
base64 = "0.22"
twox-hash = { version = "2", default-features = false, features = ["xxhash3_64"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache", "hooks", "pointer"] }
opencode-search = { path = "../opencode-search" }
memmap2 = "0.9"
zstd = { version = "0.13", default-features = false }
opencode-kit = { path = "../opencode-kit" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Storage",
    "Event",
    "IdbFactory",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbObjectStoreParameters",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "IdbCursorWithValue",
    "IdbKeyRange",
    "DomStringList",
] }

[lints]
workspace = true
