[package]
name = "ureq-web"
version = "0.0.1"
description = "The part of ureq's blocking API the app uses, over a browser page's synchronous XMLHttpRequest"
edition.workspace = true
license.workspace = true
publish = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
http = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["XmlHttpRequest"] }

[lints]
workspace = true
