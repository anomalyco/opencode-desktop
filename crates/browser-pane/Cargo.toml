[package]
name = "browser-pane"
version = "0.0.1"
description = "Embeddable Chromium browser pane for Rune apps via the OpenCode Browser Engine sidecar"
edition.workspace = true
license.workspace = true

[features]
# Off by default, so `--workspace` builds don't turn it on for the app where no engine ships.
default = []
# Download, start and talk to the CEF engine over a Unix socket (Unix hosts only). Without it, the
# pane keeps its tab model and reports `EngineStatus::Unsupported`. The app turns it on for macOS;
# test it on its own with `cargo test -p browser-pane --features engine`.
engine = []

[dependencies]
base64 = "0.22"
rune.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
ureq = { workspace = true, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
