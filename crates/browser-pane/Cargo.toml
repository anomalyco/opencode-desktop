[package]
name = "browser-pane"
version = "0.0.1"
description = "Embeddable Chromium browser pane for Rune apps via the OpenCode Browser Engine sidecar"
edition.workspace = true
license.workspace = true

[features]
# Off by default, so `--workspace` builds don't turn it on for the app where no engine ships.
default = []
# Download, start and talk to the CEF engine over a Unix socket (AF_UNIX on Windows too). Without it,
# the pane keeps its tab model and reports `EngineStatus::Unsupported`. The app turns it on for macOS
# and Windows; test it on its own with `cargo test -p browser-pane --features engine`.
engine = ["dep:libc", "dep:sha2", "dep:ureq", "dep:uds_windows", "dep:windows"]

[dependencies]
base64 = "0.22"
rune.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2 = { version = "0.10", optional = true }
ureq = { workspace = true, features = ["rustls"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

# The engine's socket: AF_UNIX, in Windows 10 1803 and later. `windows`: the background download's
# thread priority and its pause checks (power line, connection cost).
[target.'cfg(windows)'.dependencies]
uds_windows = { version = "1.1", optional = true }
windows = { version = "0.62", optional = true, features = [
    "Networking_Connectivity",
    "Win32_System_Power",
    "Win32_System_Threading",
] }

[lints]
workspace = true
