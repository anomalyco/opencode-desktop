[package]
name = "otlp-lite"
version = "0.0.1"
description = "Minimal OTLP/HTTP trace and log exporter"
edition.workspace = true
license.workspace = true

[dependencies]
# Its clock (`rune::time`), which a browser build needs: std's has none there.
rune = { workspace = true, default-features = false }
serde_json.workspace = true

# The machine's name for spans (`host.name`), asked of the system rather than of a `hostname` program.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
