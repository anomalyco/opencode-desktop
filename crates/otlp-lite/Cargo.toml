[package]
name = "otlp-lite"
version = "0.0.1"
description = "Minimal OTLP/HTTP trace and log exporter"
edition.workspace = true
license.workspace = true

[dependencies]
# Browser-safe monotonic and wall clocks (`std::time` on native, `performance.now()`/`Date.now()` on wasm32).
web-time = "1.1"
serde_json.workspace = true

# The machine's name for spans (`host.name`), asked of the system rather than of a `hostname` program.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
