[package]
name = "opencode-i18n"
version = "0.0.1"
description = "OpenCode Desktop's message catalogs (its 63 locales, synced from the opencode repo) and the app's own strings, with compile-time keys"
edition.workspace = true
license.workspace = true

[dependencies]
rune-i18n.workspace = true

# A page fetches the locale it shows (`web.rs`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console"] }

[build-dependencies]
rune-i18n = { workspace = true, features = ["codegen"] }

[lints]
workspace = true
