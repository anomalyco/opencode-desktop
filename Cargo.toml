[workspace]
resolver = "3"
members = ["apps/desktop", "apps/sketch", "crates/browser-pane", "crates/hex-client", "crates/opencode-kit", "crates/project-icon", "crates/rune-rolling", "crates/seer-domain", "crates/seer-ffi", "crates/seer-sync", "crates/seer-worker"]
exclude = ["apps/browser-engine"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "30c8348f5984030ce4cd0488d8c82eb1479dede8" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "30c8348f5984030ce4cd0488d8c82eb1479dede8" }
rune-mermaid = { git = "https://github.com/anomalyco/rune", rev = "30c8348f5984030ce4cd0488d8c82eb1479dede8" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "30c8348f5984030ce4cd0488d8c82eb1479dede8" }
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "30c8348f5984030ce4cd0488d8c82eb1479dede8" }
procwatch = { git = "https://github.com/anomalyco/rune", rev = "30c8348f5984030ce4cd0488d8c82eb1479dede8" }
rune-knobs = { git = "https://github.com/anomalyco/rune", rev = "30c8348f5984030ce4cd0488d8c82eb1479dede8" }
rune-mac = { git = "https://github.com/anomalyco/rune", rev = "30c8348f5984030ce4cd0488d8c82eb1479dede8" }
rune-perf = { git = "https://github.com/anomalyco/rune", rev = "30c8348f5984030ce4cd0488d8c82eb1479dede8" }
rune-register = { git = "https://github.com/anomalyco/rune", rev = "30c8348f5984030ce4cd0488d8c82eb1479dede8" }
serde_json = "1"
ureq = { version = "3.4", default-features = false }
# Seer's shared data (crates/seer-domain). Private repo: .cargo/config.toml fetches it with git.
wraith-core = { git = "https://github.com/anomalyco/wraith", rev = "12ce64733292454261484c4117871707685847f5" }
wraith-local = { git = "https://github.com/anomalyco/wraith", rev = "12ce64733292454261484c4117871707685847f5" }
wraith-do = { git = "https://github.com/anomalyco/wraith", rev = "12ce64733292454261484c4117871707685847f5", default-features = false }
seer-domain = { path = "crates/seer-domain" }

[profile.dev.package."*"]
debug = false
opt-level = 3

# Procedural icons shade every pixel on the CPU.
[profile.dev.package.project-icon]
opt-level = 3

[profile.release]
codegen-units = 16
incremental = true

[profile.rune-hot]
inherits = "dev"
debug = 0
incremental = true

[profile.perf]
inherits = "release"
incremental = false
debug = 1
