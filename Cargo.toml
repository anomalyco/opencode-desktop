[workspace]
resolver = "3"
members = ["apps/desktop", "apps/note-web", "apps/sketch", "crates/browser-pane", "crates/hex-client", "crates/opencode-kit", "crates/otlp-lite", "crates/project-icon", "crates/rune-parts", "crates/rune-rolling", "crates/seer-domain", "crates/seer-ffi", "crates/seer-sync", "crates/seer-worker", "crates/terminal"]
exclude = ["apps/browser-engine"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "90b295a752d1883870f44c5a399453657f28d183" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "90b295a752d1883870f44c5a399453657f28d183" }
rune-mermaid = { git = "https://github.com/anomalyco/rune", rev = "90b295a752d1883870f44c5a399453657f28d183" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "90b295a752d1883870f44c5a399453657f28d183" }
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "90b295a752d1883870f44c5a399453657f28d183" }
procwatch = { git = "https://github.com/anomalyco/rune", rev = "90b295a752d1883870f44c5a399453657f28d183" }
rune-knobs = { git = "https://github.com/anomalyco/rune", rev = "90b295a752d1883870f44c5a399453657f28d183" }
rune-mac = { git = "https://github.com/anomalyco/rune", rev = "90b295a752d1883870f44c5a399453657f28d183" }
rune-perf = { git = "https://github.com/anomalyco/rune", rev = "90b295a752d1883870f44c5a399453657f28d183" }
rune-register = { git = "https://github.com/anomalyco/rune", rev = "90b295a752d1883870f44c5a399453657f28d183" }
serde_json = "1"
ureq = { version = "3.4", default-features = false }
# Seer's shared data (crates/seer-domain). Private repo: .cargo/config.toml fetches it with git.
wraith-core = { git = "https://github.com/anomalyco/wraith", rev = "d40fbe8fc490312b8151cdc6f8f8cc3cddecdd6c" }
wraith-local = { git = "https://github.com/anomalyco/wraith", rev = "d40fbe8fc490312b8151cdc6f8f8cc3cddecdd6c" }
wraith-do = { git = "https://github.com/anomalyco/wraith", rev = "d40fbe8fc490312b8151cdc6f8f8cc3cddecdd6c", default-features = false }
seer-domain = { path = "crates/seer-domain" }

[profile.dev.package."*"]
debug = false
opt-level = 3

# Procedural icons shade every pixel on the CPU.
[profile.dev.package.project-icon]
opt-level = 3

[profile.release]
codegen-units = 16
incremental = true

[profile.rune-hot]
inherits = "dev"
debug = 0
incremental = true

[profile.perf]
inherits = "release"
incremental = false
debug = 1

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[workspace.lints.rust]
# shared-lints begin
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
# shared-lints end
# shared: forbid; 173 sites left (t1003)
unsafe_code = "warn"

[workspace.lints.clippy]
# shared-lints begin
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
disallowed_types = "deny"
expect_used = "warn"
todo = "warn"
unwrap_used = "warn"
# shared-lints end
# shared: deny; 264 sites left (t1003)
let_underscore_must_use = "warn"
# shared: deny; 128 sites left (t1003)
disallowed_methods = "warn"
# shared: deny; 139 sites left (t1003)
undocumented_unsafe_blocks = "warn"
