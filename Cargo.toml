[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "apps/installer",
    "apps/web",
    "features/connect",
    "features/dictation",
    "features/egg",
    "features/mcp",
    "features/mentions",
    "features/office",
    "features/open-in",
    "features/review",
    "features/subagents",
    "features/switcher",
    "features/tips",
    "features/updater",
    "features/usage",
    "crates/authenticode",
    "crates/browser-pane",
    "crates/hex-client",
    "crates/office-preview",
    "crates/opencode-code-view",
    "crates/opencode-i18n",
    "crates/opencode-kernel",
    "crates/opencode-kit",
    "crates/opencode-platform",
    "crates/opencode-plugin-spec",
    "crates/opencode-runtime",
    "crates/opencode-search",
    "crates/opencode-storage",
    "crates/opencode-ui",
    "crates/otlp-lite",
    "crates/project-icon",
    "crates/rune-parts",
    "crates/session-view",
    "crates/terminal",
    "crates/ureq-web",
    "crates/win-install",
]
exclude = ["apps/browser-engine"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Rune's default features less two the app doesn't use: `embedded-fonts` (the app registers its own
# faces, so Rune's bundled Inter was 1.25 MB nobody drew with) and `ogg-audio` (Ogg and Opus audio
# for macOS video, which apps/desktop turns on for macOS alone).
rune = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a", default-features = false, features = ["accessibility", "dbus", "metal-backend", "svg"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
rune-luau = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
rune-mermaid = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
rune-i18n = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
procwatch = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
rune-knobs = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
rune-mac = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
rune-notify = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
rune-perf = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
rune-register = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
# Objects keep their keys in the order they arrive, as JavaScript's do: a tool's arguments list as
# Desktop lists them.
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "3.4", default-features = false }

# BetterOffice's Word engine builds against its own yrs fork, as its workspace patches it.
[patch.crates-io]
# mimalloc with small pages committed on demand too (`vendor/libmimalloc-sys.patch`): ~11 MB less at Home, ~26 MB after a busy
# spell, no launch or frame cost measured. Keep the version equal to what `mimalloc` asks for.
libmimalloc-sys = { path = "vendor/libmimalloc-sys" }
# Rune's wgpu-hal (wgpu-hal as published plus `dx12::Instance::expose_adapter` and partial presents,
# `vendor/wgpu-hal` in the Rune repo), at the Rune rev pinned above: a window's GPU is then the one adapter
# Rune picks through DXGI, with no device made on the others, and a frame presents only what changed.
# Keep the rev equal to the `rune` rev.
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
# Rune's winit (winit 0.30 as published plus `vendor/winit.patch`: a new Windows window isn't added again
# to the taskbar it's already on, which cost CoInitializeEx and a TaskbarList COM object on the UI
# thread before the first frame). Keep the rev equal to the `rune` rev.
winit = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
# Rune's accesskit_windows (0.35.2 as published plus `vendor/accesskit_windows.patch`: headings and
# landmarks reach UI Automation; a field past 64 KiB keeps its text pattern). At the same rev as `rune`.
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
# Rune's accesskit_macos (0.27.2 as published plus `vendor/accesskit_macos.patch`: headings reach
# VoiceOver as AppKit's AXHeading with their level; a field past 64 KiB keeps its line ranges). At the same
# rev as `rune`.
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
# Rune's parley_engine (0.12.0 as published plus `vendor/parley_engine.patch`: UAX #9 rule L1 at a
# paragraph's end, so Unicode's BidiTest.txt passes whole; segmenters and font metrics made once,
# not for every text and run). Keep the rev equal to the `rune` rev.
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
yrs = { git = "https://github.com/openooxml/y-crdt.git", rev = "e785c00611ebce79ece115defa25295982cac165" }

# Keep dependencies lean in dev (opt-level = 1 cuts cold build time, RAM, and target/ size
# across Windows/macOS/Linux), while keeping full -O3 on the small set of CPU-hot crates
# that draw glyphs, shade icons, or decode images/streams every frame.
[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.dev.package.project-icon]
opt-level = 3
[profile.dev.package.rune]
opt-level = 3
[profile.dev.package.parley_engine]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.opencode-search]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3

# What ships, and what timing measures (build it with apps/desktop/scripts/release.ps1, which adds the
# profile-guided optimisation profile): the whole program optimised as one (fat LTO, one codegen unit),
# 25 to 60 minutes and about 10 GB for one rustc, so only on a machine that can spare them. No debug info:
# with it the one LTO module outgrew 28 GB. Native stacks with names come from `perf` builds.
[profile.release]
lto = "fat"
codegen-units = 1
incremental = false

# A release build in minutes, for iterating on something you then time with `release`: 16 codegen units,
# no cross-crate LTO. Not incremental: an optimised build's incremental state outlived a Rune bump and
# linked against `anon.*.llvm.*` symbols the new units no longer had (LNK2019), and CI builds without it.
[profile.release-quick]
inherits = "release"
lto = false
codegen-units = 16

# Fastest edit-compile-run loop for local & mesh dev: skips DWARF/PDB emission and maximizes parallel codegen.
[profile.dev-fast]
inherits = "dev"
debug = 0
codegen-units = 64

# Near-release runtime speed at a fraction of fat-LTO's ~10 GB RAM and 25-60 min build time.
[profile.release-thin]
inherits = "release"
lto = "thin"
codegen-units = 16

[profile.rune-hot]
inherits = "dev"
debug = 0
incremental = true

[profile.perf]
inherits = "release-quick"
incremental = false
debug = 1

[workspace.lints.rust]
# shared-lints begin
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
# shared-lints end
unsafe_code = "warn"
# apps/web compiles apps/desktop's crate; for a native target it turns the crate off with this.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(opencode_web_host)"] }

[workspace.lints.clippy]
# shared-lints begin
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
disallowed_types = "deny"
expect_used = "warn"
todo = "warn"
unwrap_used = "warn"
# shared-lints end
let_underscore_must_use = "warn"
disallowed_methods = "warn"
undocumented_unsafe_blocks = "warn"
