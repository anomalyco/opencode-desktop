[workspace]
resolver = "3"
members = ["app", "apps/desktop", "apps/sketch", "crates/opencode-kit", "crates/mac-app", "crates/rune-knobs", "crates/project-icon", "crates/rune-playground"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "c0cbe5947d5bac73f9b06be2c60340f237d22591" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "c0cbe5947d5bac73f9b06be2c60340f237d22591" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "c0cbe5947d5bac73f9b06be2c60340f237d22591" }
procwatch = { git = "https://github.com/anomalyco/rune", rev = "c0cbe5947d5bac73f9b06be2c60340f237d22591" }
serde_json = "1"
ureq = { version = "3.4", default-features = false }

[profile.dev.package."*"]
debug = false
opt-level = 3

# Procedural icons shade every pixel on the CPU.
[profile.dev.package.project-icon]
opt-level = 3

[profile.release]
codegen-units = 16
incremental = true

[profile.rune-hot]
inherits = "dev"
debug = 0
incremental = true

[profile.perf]
inherits = "release"
incremental = false
debug = 1
