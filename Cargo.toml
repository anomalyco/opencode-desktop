[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "crates/browser-pane",
    "crates/hex-client",
    "crates/opencode-kit",
    "crates/opencode-plugin",
    "crates/otlp-lite",
    "crates/project-icon",
    "crates/rune-parts",
    "crates/session-view",
    "crates/terminal",
    "plugins/hello",
]
exclude = ["apps/browser-engine"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "1571ad5792a372483e6beebe9a0f9e6d74b138df" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "1571ad5792a372483e6beebe9a0f9e6d74b138df" }
rune-mermaid = { git = "https://github.com/anomalyco/rune", rev = "1571ad5792a372483e6beebe9a0f9e6d74b138df" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "1571ad5792a372483e6beebe9a0f9e6d74b138df" }
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "1571ad5792a372483e6beebe9a0f9e6d74b138df" }
procwatch = { git = "https://github.com/anomalyco/rune", rev = "1571ad5792a372483e6beebe9a0f9e6d74b138df" }
rune-knobs = { git = "https://github.com/anomalyco/rune", rev = "1571ad5792a372483e6beebe9a0f9e6d74b138df" }
rune-mac = { git = "https://github.com/anomalyco/rune", rev = "1571ad5792a372483e6beebe9a0f9e6d74b138df" }
rune-perf = { git = "https://github.com/anomalyco/rune", rev = "1571ad5792a372483e6beebe9a0f9e6d74b138df" }
rune-register = { git = "https://github.com/anomalyco/rune", rev = "1571ad5792a372483e6beebe9a0f9e6d74b138df" }
serde_json = "1"
ureq = { version = "3.4", default-features = false }

[profile.dev.package."*"]
debug = false
opt-level = 3

# Procedural icons shade every pixel on the CPU.
[profile.dev.package.project-icon]
opt-level = 3

[profile.release]
codegen-units = 16
incremental = true

# Plugin libraries: one codegen unit and no symbols keep a cdylib small. Each plugin crate
# needs its own line; a profile override can't match a family of packages.
[profile.release.package.opencode-plugin-hello]
codegen-units = 1
opt-level = "s"
strip = "symbols"

[profile.release.package.opencode-plugin]
codegen-units = 1
opt-level = "s"

[profile.rune-hot]
inherits = "dev"
debug = 0
incremental = true

[profile.perf]
inherits = "release"
incremental = false
debug = 1

[workspace.lints.rust]
# shared-lints begin
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
# shared-lints end
unsafe_code = "warn"

[workspace.lints.clippy]
# shared-lints begin
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
disallowed_types = "deny"
expect_used = "warn"
todo = "warn"
unwrap_used = "warn"
# shared-lints end
let_underscore_must_use = "warn"
disallowed_methods = "warn"
undocumented_unsafe_blocks = "warn"
