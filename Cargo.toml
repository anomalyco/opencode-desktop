[workspace]
resolver = "3"
members = ["app", "apps/desktop", "apps/sketch", "crates/opencode-kit"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "c7ee68ef9944980fbf848ef348971f7c9fc20d16" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "c7ee68ef9944980fbf848ef348971f7c9fc20d16" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "c7ee68ef9944980fbf848ef348971f7c9fc20d16" }
serde_json = "1"
ureq = { version = "3.4", default-features = false }

[profile.dev.package."*"]
debug = false
opt-level = 3

[profile.release]
codegen-units = 16
incremental = true

[profile.rune-hot]
inherits = "dev"
debug = 0
incremental = true
