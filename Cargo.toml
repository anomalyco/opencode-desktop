[workspace]
resolver = "3"
members = ["app", "apps/desktop", "apps/sketch", "crates/opencode-kit", "crates/mac-app", "crates/rune-knobs"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "b673cb74d1145653177fd383f7c5a2db46e96c20" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "b673cb74d1145653177fd383f7c5a2db46e96c20" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "b673cb74d1145653177fd383f7c5a2db46e96c20" }
procwatch = { git = "https://github.com/anomalyco/rune", rev = "b673cb74d1145653177fd383f7c5a2db46e96c20" }
serde_json = "1"
ureq = { version = "3.4", default-features = false }

[profile.dev.package."*"]
debug = false
opt-level = 3

[profile.release]
codegen-units = 16
incremental = true

[profile.rune-hot]
inherits = "dev"
debug = 0
incremental = true

[profile.perf]
inherits = "release"
incremental = false
debug = 1
