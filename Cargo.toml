[workspace]
resolver = "3"
members = ["apps/desktop", "apps/sketch", "crates/hex-client", "crates/opencode-kit", "crates/mac-app", "crates/rune-knobs", "crates/project-icon", "crates/rune-playground", "crates/seer-domain"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "1026bd4ccbb54f6a4c2bb5c7d11c1cbdbf3f4649" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "1026bd4ccbb54f6a4c2bb5c7d11c1cbdbf3f4649" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "1026bd4ccbb54f6a4c2bb5c7d11c1cbdbf3f4649" }
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "1026bd4ccbb54f6a4c2bb5c7d11c1cbdbf3f4649" }
procwatch = { git = "https://github.com/anomalyco/rune", rev = "1026bd4ccbb54f6a4c2bb5c7d11c1cbdbf3f4649" }
serde_json = "1"
ureq = { version = "3.4", default-features = false }
# Seer's shared data (crates/seer-domain). Private repo: .cargo/config.toml fetches it with git.
wraith-core = { git = "https://github.com/anomalyco/wraith", rev = "5f734493ab9e676e28f6ab56300dbfb5c910b08c" }
wraith-local = { git = "https://github.com/anomalyco/wraith", rev = "5f734493ab9e676e28f6ab56300dbfb5c910b08c" }

[profile.dev.package."*"]
debug = false
opt-level = 3

# Procedural icons shade every pixel on the CPU.
[profile.dev.package.project-icon]
opt-level = 3

[profile.release]
codegen-units = 16
incremental = true

[profile.rune-hot]
inherits = "dev"
debug = 0
incremental = true

[profile.perf]
inherits = "release"
incremental = false
debug = 1
