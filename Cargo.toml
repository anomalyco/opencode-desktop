[workspace]
resolver = "3"
members = ["apps/desktop", "apps/note-web", "apps/sketch", "crates/browser-pane", "crates/hex-client", "crates/opencode-kit", "crates/project-icon", "crates/rune-rolling", "crates/seer-domain", "crates/seer-ffi", "crates/seer-sync", "crates/seer-worker", "crates/terminal"]
exclude = ["apps/browser-engine"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "29df6816178dec5434b6cb9c8fd696dbe4da670d" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "29df6816178dec5434b6cb9c8fd696dbe4da670d" }
rune-mermaid = { git = "https://github.com/anomalyco/rune", rev = "29df6816178dec5434b6cb9c8fd696dbe4da670d" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "29df6816178dec5434b6cb9c8fd696dbe4da670d" }
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "29df6816178dec5434b6cb9c8fd696dbe4da670d" }
procwatch = { git = "https://github.com/anomalyco/rune", rev = "29df6816178dec5434b6cb9c8fd696dbe4da670d" }
rune-knobs = { git = "https://github.com/anomalyco/rune", rev = "29df6816178dec5434b6cb9c8fd696dbe4da670d" }
rune-mac = { git = "https://github.com/anomalyco/rune", rev = "29df6816178dec5434b6cb9c8fd696dbe4da670d" }
rune-perf = { git = "https://github.com/anomalyco/rune", rev = "29df6816178dec5434b6cb9c8fd696dbe4da670d" }
rune-register = { git = "https://github.com/anomalyco/rune", rev = "29df6816178dec5434b6cb9c8fd696dbe4da670d" }
serde_json = "1"
ureq = { version = "3.4", default-features = false }
# Seer's shared data (crates/seer-domain). Private repo: .cargo/config.toml fetches it with git.
wraith-core = { git = "https://github.com/anomalyco/wraith", rev = "3b07ad7713ea0472086bfc3c88964c334528a9b6" }
wraith-local = { git = "https://github.com/anomalyco/wraith", rev = "3b07ad7713ea0472086bfc3c88964c334528a9b6" }
wraith-do = { git = "https://github.com/anomalyco/wraith", rev = "3b07ad7713ea0472086bfc3c88964c334528a9b6", default-features = false }
seer-domain = { path = "crates/seer-domain" }

[profile.dev.package."*"]
debug = false
opt-level = 3

# Procedural icons shade every pixel on the CPU.
[profile.dev.package.project-icon]
opt-level = 3

[profile.release]
codegen-units = 16
incremental = true

[profile.rune-hot]
inherits = "dev"
debug = 0
incremental = true

[profile.perf]
inherits = "release"
incremental = false
debug = 1

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
