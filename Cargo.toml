[workspace]
resolver = "3"
members = ["app", "apps/desktop", "apps/sketch", "crates/opencode-kit", "crates/mac-app", "crates/rune-knobs"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "3f70cd6b675c89a8a7b64fc09b1bf2b455e0ad1a" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "3f70cd6b675c89a8a7b64fc09b1bf2b455e0ad1a" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "3f70cd6b675c89a8a7b64fc09b1bf2b455e0ad1a" }
serde_json = "1"
ureq = { version = "3.4", default-features = false }

[profile.dev.package."*"]
debug = false
opt-level = 3

[profile.release]
codegen-units = 16
incremental = true

[profile.rune-hot]
inherits = "dev"
debug = 0
incremental = true
