[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "apps/installer",
    "apps/web",
    "crates/authenticode",
    "crates/browser-pane",
    "crates/hex-client",
    "crates/office-preview",
    "crates/opencode-i18n",
    "crates/opencode-kit",
    "crates/opencode-plugin-spec",
    "crates/opencode-storage",
    "crates/otlp-lite",
    "crates/project-icon",
    "crates/rune-parts",
    "crates/session-view",
    "crates/terminal",
    "crates/ureq-web",
    "crates/win-install",
]
exclude = ["apps/browser-engine"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Rune's default features less two the app doesn't use: `embedded-fonts` (the app registers its own
# faces, so Rune's bundled Inter was 1.25 MB nobody drew with) and `ogg-audio` (Ogg and Opus audio
# for macOS video, which apps/desktop turns on for macOS alone).
rune = { git = "https://github.com/anomalyco/rune", rev = "d8b3713e51bc2090f43e3dc7bb561f26518db513", default-features = false, features = ["accessibility", "dbus", "metal-backend", "svg"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "d8b3713e51bc2090f43e3dc7bb561f26518db513" }
rune-luau = { git = "https://github.com/anomalyco/rune", rev = "d8b3713e51bc2090f43e3dc7bb561f26518db513" }
rune-mermaid = { git = "https://github.com/anomalyco/rune", rev = "d8b3713e51bc2090f43e3dc7bb561f26518db513" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "d8b3713e51bc2090f43e3dc7bb561f26518db513" }
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "d8b3713e51bc2090f43e3dc7bb561f26518db513" }
rune-i18n = { git = "https://github.com/anomalyco/rune", rev = "d8b3713e51bc2090f43e3dc7bb561f26518db513" }
procwatch = { git = "https://github.com/anomalyco/rune", rev = "d8b3713e51bc2090f43e3dc7bb561f26518db513" }
rune-knobs = { git = "https://github.com/anomalyco/rune", rev = "d8b3713e51bc2090f43e3dc7bb561f26518db513" }
rune-mac = { git = "https://github.com/anomalyco/rune", rev = "d8b3713e51bc2090f43e3dc7bb561f26518db513" }
rune-notify = { git = "https://github.com/anomalyco/rune", rev = "d8b3713e51bc2090f43e3dc7bb561f26518db513" }
rune-perf = { git = "https://github.com/anomalyco/rune", rev = "d8b3713e51bc2090f43e3dc7bb561f26518db513" }
rune-register = { git = "https://github.com/anomalyco/rune", rev = "d8b3713e51bc2090f43e3dc7bb561f26518db513" }
# Objects keep their keys in the order they arrive, as JavaScript's do: a tool's arguments list as
# Desktop lists them.
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "3.4", default-features = false }

# BetterOffice's Word engine builds against its own yrs fork, as its workspace patches it.
[patch.crates-io]
# mimalloc with small pages committed on demand too (`vendor/libmimalloc-sys.patch`): ~11 MB less at Home, ~26 MB after a busy
# spell, no launch or frame cost measured. Keep the version equal to what `mimalloc` asks for.
libmimalloc-sys = { path = "vendor/libmimalloc-sys" }
# Rune's wgpu-hal (wgpu-hal as published plus `dx12::Instance::expose_adapter` and partial presents,
# `vendor/wgpu-hal` in the Rune repo), at the Rune rev pinned above: a window's GPU is then the one adapter
# Rune picks through DXGI, with no device made on the others, and a frame presents only what changed.
# Keep the rev equal to the `rune` rev.
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "d8b3713e51bc2090f43e3dc7bb561f26518db513" }
# Rune's winit (winit 0.30 as published plus `vendor/winit.patch`: a new Windows window isn't added again
# to the taskbar it's already on, which cost CoInitializeEx and a TaskbarList COM object on the UI
# thread before the first frame). Keep the rev equal to the `rune` rev.
winit = { git = "https://github.com/anomalyco/rune", rev = "d8b3713e51bc2090f43e3dc7bb561f26518db513" }
# Rune's accesskit_windows (0.35.2 as published plus `vendor/accesskit_windows.patch`: headings and
# landmarks reach UI Automation). At the same rev as `rune`.
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "d8b3713e51bc2090f43e3dc7bb561f26518db513" }
# Rune's parley_engine (0.12.0 as published plus `vendor/parley_engine.patch`: UAX #9 rule L1 at a
# paragraph's end, so Unicode's BidiTest.txt passes whole; segmenters and font metrics made once,
# not for every text and run). Keep the rev equal to the `rune` rev.
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "d8b3713e51bc2090f43e3dc7bb561f26518db513" }
yrs = { git = "https://github.com/openooxml/y-crdt.git", rev = "e785c00611ebce79ece115defa25295982cac165" }

[profile.dev.package."*"]
debug = false
opt-level = 3

# Procedural icons shade every pixel on the CPU.
[profile.dev.package.project-icon]
opt-level = 3

# What ships, and what timing measures (build it with apps/desktop/scripts/release.ps1, which adds the
# profile-guided optimisation profile): the whole program optimised as one (fat LTO, one codegen unit),
# 25 to 60 minutes and about 10 GB for one rustc, so only on a machine that can spare them. No debug info:
# with it the one LTO module outgrew 28 GB. Native stacks with names come from `perf` builds.
[profile.release]
lto = "fat"
codegen-units = 1
incremental = false

# A release build in minutes, for iterating on something you then time with `release`: 16 codegen units,
# no cross-crate LTO. Not incremental: an optimised build's incremental state outlived a Rune bump and
# linked against `anon.*.llvm.*` symbols the new units no longer had (LNK2019), and CI builds without it.
[profile.release-quick]
inherits = "release"
lto = false
codegen-units = 16

[profile.rune-hot]
inherits = "dev"
debug = 0
incremental = true

[profile.perf]
inherits = "release-quick"
incremental = false
debug = 1

[workspace.lints.rust]
# shared-lints begin
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
# shared-lints end
unsafe_code = "warn"
# apps/web compiles apps/desktop's crate; for a native target it turns the crate off with this.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(opencode_web_host)"] }

[workspace.lints.clippy]
# shared-lints begin
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
disallowed_types = "deny"
expect_used = "warn"
todo = "warn"
unwrap_used = "warn"
# shared-lints end
let_underscore_must_use = "warn"
disallowed_methods = "warn"
undocumented_unsafe_blocks = "warn"

