[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "apps/installer",
    "apps/web",
    "crates/browser-pane",
    "crates/hex-client",
    "crates/office-preview",
    "crates/opencode-i18n",
    "crates/opencode-kit",
    "crates/opencode-plugin-spec",
    "crates/opencode-storage",
    "crates/otlp-lite",
    "crates/project-icon",
    "crates/rune-parts",
    "crates/session-view",
    "crates/terminal",
    "crates/ureq-web",
    "crates/win-install",
]
exclude = ["apps/browser-engine"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "2918ee3ec25cd4b7e1cc184da9b1200940e0d545" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "2918ee3ec25cd4b7e1cc184da9b1200940e0d545" }
rune-luau = { git = "https://github.com/anomalyco/rune", rev = "2918ee3ec25cd4b7e1cc184da9b1200940e0d545" }
rune-mermaid = { git = "https://github.com/anomalyco/rune", rev = "2918ee3ec25cd4b7e1cc184da9b1200940e0d545" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "2918ee3ec25cd4b7e1cc184da9b1200940e0d545" }
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "2918ee3ec25cd4b7e1cc184da9b1200940e0d545" }
rune-i18n = { git = "https://github.com/anomalyco/rune", rev = "2918ee3ec25cd4b7e1cc184da9b1200940e0d545" }
procwatch = { git = "https://github.com/anomalyco/rune", rev = "2918ee3ec25cd4b7e1cc184da9b1200940e0d545" }
rune-knobs = { git = "https://github.com/anomalyco/rune", rev = "2918ee3ec25cd4b7e1cc184da9b1200940e0d545" }
rune-mac = { git = "https://github.com/anomalyco/rune", rev = "2918ee3ec25cd4b7e1cc184da9b1200940e0d545" }
rune-notify = { git = "https://github.com/anomalyco/rune", rev = "2918ee3ec25cd4b7e1cc184da9b1200940e0d545" }
rune-perf = { git = "https://github.com/anomalyco/rune", rev = "2918ee3ec25cd4b7e1cc184da9b1200940e0d545" }
rune-register = { git = "https://github.com/anomalyco/rune", rev = "2918ee3ec25cd4b7e1cc184da9b1200940e0d545" }
# Objects keep their keys in the order they arrive, as JavaScript's do: a tool's arguments list as
# Desktop lists them.
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "3.4", default-features = false }

# BetterOffice's Word engine builds against its own yrs fork, as its workspace patches it.
[patch.crates-io]
yrs = { git = "https://github.com/openooxml/y-crdt.git", rev = "e785c00611ebce79ece115defa25295982cac165" }

[profile.dev.package."*"]
debug = false
opt-level = 3

# Procedural icons shade every pixel on the CPU.
[profile.dev.package.project-icon]
opt-level = 3

[profile.release]
codegen-units = 16
incremental = true

[profile.rune-hot]
inherits = "dev"
debug = 0
incremental = true

[profile.perf]
inherits = "release"
incremental = false
debug = 1

[workspace.lints.rust]
# shared-lints begin
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
# shared-lints end
unsafe_code = "warn"
# apps/web compiles apps/desktop's crate; for a native target it turns the crate off with this.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(opencode_web_host)"] }

[workspace.lints.clippy]
# shared-lints begin
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
disallowed_types = "deny"
expect_used = "warn"
todo = "warn"
unwrap_used = "warn"
# shared-lints end
let_underscore_must_use = "warn"
disallowed_methods = "warn"
undocumented_unsafe_blocks = "warn"

