[workspace]
resolver = "3"
members = ["apps/desktop", "apps/sketch", "crates/browser-pane", "crates/hex-client", "crates/opencode-kit", "crates/project-icon", "crates/rune-rolling", "crates/seer-domain", "crates/seer-ffi", "crates/seer-sync", "crates/seer-worker"]
exclude = ["apps/browser-engine", "vendor/wraith-text"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "5482523611949da08b49f6df91fa049e24a51cdd" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "5482523611949da08b49f6df91fa049e24a51cdd" }
rune-mermaid = { git = "https://github.com/anomalyco/rune", rev = "5482523611949da08b49f6df91fa049e24a51cdd" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "5482523611949da08b49f6df91fa049e24a51cdd" }
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "5482523611949da08b49f6df91fa049e24a51cdd" }
procwatch = { git = "https://github.com/anomalyco/rune", rev = "5482523611949da08b49f6df91fa049e24a51cdd" }
rune-knobs = { git = "https://github.com/anomalyco/rune", rev = "5482523611949da08b49f6df91fa049e24a51cdd" }
rune-mac = { git = "https://github.com/anomalyco/rune", rev = "5482523611949da08b49f6df91fa049e24a51cdd" }
rune-perf = { git = "https://github.com/anomalyco/rune", rev = "5482523611949da08b49f6df91fa049e24a51cdd" }
rune-register = { git = "https://github.com/anomalyco/rune", rev = "5482523611949da08b49f6df91fa049e24a51cdd" }
serde_json = "1"
ureq = { version = "3.4", default-features = false }
# Seer's shared data (crates/seer-domain). Private repo: .cargo/config.toml fetches it with git.
wraith-core = { git = "https://github.com/anomalyco/wraith", rev = "f8717f741328051c84ff61e6273ae911ba63abbd" }
wraith-local = { git = "https://github.com/anomalyco/wraith", rev = "f8717f741328051c84ff61e6273ae911ba63abbd" }
wraith-do = { git = "https://github.com/anomalyco/wraith", rev = "f8717f741328051c84ff61e6273ae911ba63abbd", default-features = false }
seer-domain = { path = "crates/seer-domain" }

[patch."https://github.com/anomalyco/wraith"]
wraith-text = { path = "vendor/wraith-text" }

[profile.dev.package."*"]
debug = false
opt-level = 3

# Procedural icons shade every pixel on the CPU.
[profile.dev.package.project-icon]
opt-level = 3

[profile.release]
codegen-units = 16
incremental = true

[profile.rune-hot]
inherits = "dev"
debug = 0
incremental = true

[profile.perf]
inherits = "release"
incremental = false
debug = 1
