[package]
name = "opencode-plugin-pairing-impl"
version = "0.1.0"
description = "OpenCode (Rune)'s Pairing plugin: Settings › Pairing with its QR code, remote access and keep screen active, as Desktop's built-in"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
opencode-plugin = { path = "../../../crates/opencode-plugin" }
serde_json.workspace = true
# The pairing QR code's encoder, without its image or SVG renderers (no dependencies).
qrcode = { version = "0.14", default-features = false }

[lints]
workspace = true
