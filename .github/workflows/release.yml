name: OpenCode (Rune) Release

# Builds, signs, notarizes, and publishes OpenCode (Rune) (apps/desktop) to
# https://anoma.ly/release (docs/releasing.md), split the way Hex's and OpenCode's releases are:
#
# - build and verify jobs run repository code with no environment, secrets, or id-token, and
#   produce unsigned files.
# - sign and publish jobs run in the `release` environment (deployment branch: dev only), check
#   out only /.github/release/ at github.sha, run only those scripts and SHA-pinned actions, and
#   treat artifacts strictly as SHA-256-verified data. Their secrets come from AWS Secrets Manager
#   through GitHub OIDC (role github/rune-desktop-release, anomalyco/secrets), step-scoped: the
#   AWS session is only a step output of configure-aws-credentials, passed to the one step that
#   reads secrets (.github/release/with-secrets.sh). The environment holds only non-secret
#   variables (AZURE_*, APPLE_NOTARY_KEY_ID, APPLE_NOTARY_ISSUER_ID).
# - every artifact carries a SHA256SUMS whose digest the job that made it reports as an output;
#   every job that downloads it checks that digest (.github/release/verify-artifacts.sh).
#
# This file and .github/release/ are the security boundary for releases; changing .github/ needs
# Dax (.github/CODEOWNERS and the `release boundary (.github needs Dax)` ruleset). The release
# service authorizes publish jobs by their OIDC token: anomalyco/rune-desktop, this file,
# refs/heads/dev, environment release (anomalyco/release registry/opencode.json).
#
# When:
# - dev: every push to dev that changes an app file (the paths below) builds every platform,
#   signs it, publishes it on the dev channel, and puts the unsigned Windows setups on the
#   rolling pre-release. Releases never cancel each other: the running one finishes, and of the
#   pushes that land meanwhile only the newest waits (GitHub replaces an older pending run in the
#   group), so a busy dev branch still publishes.
# - workflow_dispatch from dev builds now, whatever changed: check (build, sign, verify, publish
#   nothing), dev, or stable with a bump. Stable computes vX.Y.Z from the latest tag, publishes
#   every platform, then tags v<version> and creates the GitHub release. Tags start nothing.
#
# A run always releases the commit it runs on (github.sha): there is no ref input, every job
# checks out github.sha, and the plan fails unless that is the commit it checked out on dev.

on:
  push:
    branches: [dev]
    paths:
      - "apps/desktop/**"
      - "apps/installer/**"
      - "crates/**"
      - "plugins/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/release.yml"
      - ".github/release/**"
  workflow_dispatch:
    inputs:
      channel:
        description: Run from dev. check (build and verify), dev or stable (desktop), or engine-linux (sidecar preview)
        type: choice
        options: [check, dev, stable, engine-linux]
        default: check
      bump:
        description: Stable only. Raises the latest vX.Y.Z tag by patch, minor or major
        type: choice
        options: [patch, minor, major]
        default: patch
      platforms:
        description: check and dev only. windows-x64, or all (Windows x64 and arm64, and macOS; push and stable always build all)
        type: choice
        options: [all, windows-x64]
        default: all

run-name: >-
  ${{ github.event_name == 'push' && format('dev: {0}', github.sha)
  || inputs.channel == 'engine-linux' && 'linux x64 browser engine preview'
  || inputs.channel == 'stable' && format('stable: {0} bump (dispatched)', inputs.bump)
  || format('{0}: {1} (dispatched)', inputs.channel, inputs.platforms == 'all' && 'every platform' || 'Windows x64') }}

permissions:
  contents: read

# Releases never cancel each other (see When above); a newer check run cancels an older one.
concurrency:
  group: opencode-rune-${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'dev' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'check' }}

defaults:
  run:
    shell: bash

env:
  SEER_TEAM_ID: 5NZ4Q7NXJ4
  # A release build starts from the cache, not from an earlier build of its own: incremental
  # state only makes CI's build slower and its cache larger.
  CARGO_INCREMENTAL: "0"

jobs:
  plan:
    if: github.ref == 'refs/heads/dev' && inputs.channel != 'engine-linux'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      service: ${{ steps.plan.outputs.service }}
      tag: ${{ steps.plan.outputs.tag }}
      notes-url: ${{ steps.plan.outputs.notes-url }}
      release-channel: ${{ steps.plan.outputs.release-channel }}
      release-version: ${{ steps.plan.outputs.release-version }}
      windows-arches: ${{ steps.plan.outputs.windows-arches }}
      macos: ${{ steps.plan.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: /.github/release/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: plan
        run: SHA=$(git rev-parse HEAD) bash .github/release/opencode-rune-plan.sh
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'dev' }}
          BUMP: ${{ inputs.bump || 'patch' }}
          SCOPE: ${{ inputs.platforms == 'windows-x64' && 'x64' || 'all' }}
          GH_TOKEN: ${{ github.token }}

  # Which signing values the release environment holds, read on Linux, so a Windows or macOS
  # runner is booked only to sign. Stable fails here when either is missing. The Apple
  # certificate and notary key aren't here: they're read from AWS in the signing step itself,
  # which fails if either is empty.
  credentials:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    outputs:
      azure: ${{ steps.check.outputs.azure }}
      apple: ${{ steps.check.outputs.apple }}
    steps:
      - id: check
        env:
          CHANNEL: ${{ needs.plan.outputs.channel }}
          MACOS: ${{ needs.plan.outputs.macos }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: |
          missing() { for name in "$@"; do [ -n "$(printenv "$name")" ] || printf ' %s' "$name"; done; }
          azure=$(missing AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_TRUSTED_SIGNING_ENDPOINT AZURE_TRUSTED_SIGNING_ACCOUNT_NAME AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE)
          apple=$(missing APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID)
          [ -z "$azure" ] && echo "azure=true" >> "$GITHUB_OUTPUT" || echo "azure=false" >> "$GITHUB_OUTPUT"
          [ -z "$apple" ] && echo "apple=true" >> "$GITHUB_OUTPUT" || echo "apple=false" >> "$GITHUB_OUTPUT"
          if [ "$CHANNEL" = stable ] && { [ -n "$azure" ] || [ -n "$apple" ]; }; then
            echo "::error::Stable releases need signed Windows and macOS builds; the release environment lacks:$azure$apple."
            exit 1
          fi
          [ -z "$azure" ] || echo "Skipping Authenticode signing, so no Windows targets in the feed: the release environment lacks$azure. The unsigned setups still go to the rolling pre-release (dev)." >> "$GITHUB_STEP_SUMMARY"
          [ "$MACOS" != true ] || [ -z "$apple" ] || echo "Skipping Developer ID signing: the release environment lacks$apple." >> "$GITHUB_STEP_SUMMARY"

  # ---- Build: repository code; no environment, secrets, or id-token ----------

  build-macos:
    needs: plan
    if: ${{ needs.plan.outputs.macos == 'true' }}
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 120
    env:
      OPENCODE_RUNE_VERSION: ${{ needs.plan.outputs.release-version }}
      OPENCODE_RUNE_BUILD_CHANNEL: ${{ needs.plan.outputs.release-channel }}
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # rust-toolchain.toml picks the toolchain.
      - name: Rust toolchain
        run: rustup toolchain install
      - name: Build OpenCode (Rune).app
        run: |
          apps/desktop/scripts/set-crate-version.sh "$PWD" "$OPENCODE_RUNE_VERSION"
          mkdir -p "$RUNNER_TEMP/app" "$RUNNER_TEMP/macos"
          apps/desktop/scripts/build-app.sh "$RUNNER_TEMP/app"
          OPENCODE_RUNE_SMOKE_HEADLESS=1 apps/desktop/scripts/smoke-app.sh "$RUNNER_TEMP/app/OpenCode (Rune).app"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/app/OpenCode (Rune).app" "$RUNNER_TEMP/macos/OpenCode-Rune.app.zip"
      - id: upload
        uses: ./.github/release/upload
        with:
          name: build-opencode-rune-macos-arm64
          path: ${{ runner.temp }}/macos
          retention-days: "7"

  build-windows:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.windows-arches) }}
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      OPENCODE_RUNE_VERSION: ${{ needs.plan.outputs.release-version }}
      OPENCODE_RUNE_BUILD_CHANNEL: ${{ needs.plan.outputs.release-channel }}
    # One output per arch: a matrix job's outputs are shared by its legs.
    outputs:
      digest-x64: ${{ steps.digest.outputs.digest-x64 }}
      digest-arm64: ${{ steps.digest.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # rust-toolchain.toml picks the toolchain; arm64 cross-builds on the x64 runner.
      - name: Rust toolchain
        run: |
          rustup toolchain install
          [ "${{ matrix.arch }}" = x64 ] || rustup target add aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      # The terminal's libghostty-vt, and the Zig that builds it, live outside target/.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/seer/ghostty-vt
          key: ghostty-vt-windows-${{ matrix.arch }}-${{ hashFiles('crates/terminal/build.rs', 'crates/terminal/build_support.rs') }}
      - name: Build the setup and the update zip
        shell: pwsh
        run: apps/installer/scripts/package.ps1 -Out "$env:RUNNER_TEMP/windows" -Arch ${{ matrix.arch }}
      - id: upload
        uses: ./.github/release/upload
        with:
          name: build-opencode-rune-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/windows
          retention-days: "7"
      - id: digest
        run: echo "digest-${{ matrix.arch }}=${{ steps.upload.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # The setup around the install folder sign-windows signed, so it installs the same signed files
  # the updater downloads. Repository code: a build, after the signing job (as OpenCode's
  # build-desktop-windows-installer); sign-windows-setup signs the setup next.
  package-windows:
    needs: [plan, sign-windows]
    if: ${{ !cancelled() && needs.sign-windows.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.windows-arches) }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      OPENCODE_RUNE_VERSION: ${{ needs.plan.outputs.release-version }}
      OPENCODE_RUNE_BUILD_CHANNEL: ${{ needs.plan.outputs.release-channel }}
    outputs:
      digest-x64: ${{ steps.digest.outputs.digest-x64 }}
      digest-arm64: ${{ steps.digest.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install
          [ "${{ matrix.arch }}" = x64 ] || rustup target add aarch64-pc-windows-msvc
      # No cache: the setup and its few dependencies build in less time than a cache takes to
      # restore and save, and the app's caches keep the repository's 10 GB.
      - uses: ./.github/release/download
        with:
          pattern: sign-opencode-rune-windows-app
          digests: sign-opencode-rune-windows-app=${{ needs.sign-windows.outputs.digest }}
      - name: Build the setup around the signed zip
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/in/sign-opencode-rune-windows-app/OpenCode-Rune-$env:OPENCODE_RUNE_VERSION-windows-${{ matrix.arch }}.zip"
          apps/installer/scripts/package.ps1 -Out "$env:RUNNER_TEMP/setup" -Arch ${{ matrix.arch }} -Payload $zip
      # Not build-opencode-rune-windows-*: publish-windows-dev downloads that pattern.
      - id: upload
        uses: ./.github/release/upload
        with:
          name: setup-opencode-rune-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/setup
          retention-days: "7"
      - id: digest
        run: echo "digest-${{ matrix.arch }}=${{ steps.upload.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # ---- Sign: release environment; only .github/release/ is checked out -------

  # Authenticode-signs opencode-desktop.exe and every program and library of the install folders
  # this run built (windows-arches) through Azure Artifact Signing, as OpenCode's and Hex's
  # release workflows do (GitHub OIDC into the release environment's AZURE_* values), then zips the
  # signed folders: the updater's windows-<arch> targets, which it checks against
  # updater::windows::EXPECTED_PUBLISHER. package-windows builds the setups around those zips and
  # sign-windows-setup signs them. Without the Azure values (`credentials`), dev and check go on
  # without Windows in the feed, and this job never books a runner; stable fails.
  sign-windows:
    needs: [plan, credentials, build-windows]
    if: >-
      ${{ !cancelled() && needs.credentials.outputs.azure == 'true'
      && needs.plan.outputs.windows-arches != '[]'
      && needs.build-windows.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    env: &windows-sign-env
      CHANNEL: ${{ needs.plan.outputs.channel }}
      VERSION: ${{ needs.plan.outputs.release-version }}
      ARCHES: ${{ join(fromJSON(needs.plan.outputs.windows-arches), ' ') }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    steps:
      - &checkout-release
        name: Check out the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: /.github/release/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download the unsigned builds
        uses: ./.github/release/download
        with:
          pattern: build-opencode-rune-windows-*
          digests: >-
            build-opencode-rune-windows-x64=${{ needs.build-windows.outputs.digest-x64 }}
            build-opencode-rune-windows-arm64=${{ needs.build-windows.outputs.digest-arm64 }}
      - name: Unpack the install folders
        shell: pwsh
        run: |
          foreach ($arch in $env:ARCHES -split ' ') {
            Expand-Archive -LiteralPath "$env:RUNNER_TEMP/in/build-opencode-rune-windows-$arch/OpenCode-Rune-$env:VERSION-windows-$arch.zip" -DestinationPath "$env:RUNNER_TEMP/work/windows-$arch"
          }
      - &azure-login
        name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - &azure-sign
        name: Sign
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ env.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ runner.temp }}\work
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: OpenCode (Rune)
          description-url: https://github.com/anomalyco/rune-desktop
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          # Fetch the signing tools fresh: the Actions cache is shared with build jobs that run
          # repository code, so a restored entry could be a poisoned module run here.
          cache-dependencies: false
      - &azure-verify
        name: Check the signatures
        shell: pwsh
        run: .github/release/opencode-rune-verify-windows.ps1 -Folders "$env:RUNNER_TEMP/work"
      - name: Zip the signed install folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/out" | Out-Null
          foreach ($arch in $env:ARCHES -split ' ') {
            Compress-Archive -Path "$env:RUNNER_TEMP/work/windows-$arch/*" -DestinationPath "$env:RUNNER_TEMP/out/OpenCode-Rune-$env:VERSION-windows-$arch.zip"
          }
      - id: upload
        uses: ./.github/release/upload
        with:
          name: sign-opencode-rune-windows-app
          path: ${{ runner.temp }}/out

  sign-windows-setup:
    needs: [plan, sign-windows, package-windows]
    if: ${{ !cancelled() && needs.sign-windows.result == 'success' && needs.package-windows.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    env: *windows-sign-env
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    steps:
      - *checkout-release
      - name: Download the setups
        uses: ./.github/release/download
        with:
          pattern: setup-opencode-rune-windows-*
          digests: >-
            setup-opencode-rune-windows-x64=${{ needs.package-windows.outputs.digest-x64 }}
            setup-opencode-rune-windows-arm64=${{ needs.package-windows.outputs.digest-arm64 }}
      - name: Download the signed zips
        uses: ./.github/release/download
        with:
          pattern: sign-opencode-rune-windows-app
          digests: sign-opencode-rune-windows-app=${{ needs.sign-windows.outputs.digest }}
          folder: app
      - name: Gather the setups
        run: |
          temp=$(cygpath -u "$RUNNER_TEMP")
          mkdir -p "$temp/work" && cp "$temp"/in/setup-opencode-rune-windows-*/*.exe "$temp/work/"
      - *azure-login
      - *azure-sign
      - *azure-verify
      - name: Gather the release files
        run: |
          temp=$(cygpath -u "$RUNNER_TEMP")
          mkdir -p "$temp/out" && cp "$temp"/work/*.exe "$temp"/app/sign-opencode-rune-windows-app/*.zip "$temp/out/"
      - id: upload
        uses: ./.github/release/upload
        with:
          name: sign-opencode-rune-windows
          path: ${{ runner.temp }}/out

  # Developer ID signing and notarization, whenever this run built macOS; booked only when the
  # release environment holds the notary IDs (`credentials`).
  sign-macos:
    needs: [plan, credentials, build-macos]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.macos == 'true'
      && needs.credentials.outputs.apple == 'true'
      && needs.build-macos.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      OPENCODE_RUNE_VERSION: ${{ needs.plan.outputs.release-version }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    steps:
      - *checkout-release
      - name: Download unsigned app
        uses: ./.github/release/download
        with:
          pattern: build-opencode-rune-macos-arm64
          digests: build-opencode-rune-macos-arm64=${{ needs.build-macos.outputs.digest }}
      # AWS credentials only as this action's step outputs (never in the job's environment), for
      # the one step below that reads the secrets.
      - id: aws
        name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/rune-desktop-release
          role-session-name: rune-desktop-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: us-east-1
          output-env-credentials: false
          output-credentials: true
      - name: Import the certificate and notary key
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
        run: |
          bash .github/release/with-secrets.sh \
            APPLE_SIGNING_CERTIFICATE=shared/APPLE_SIGNING_CERTIFICATE \
            APPLE_NOTARY_KEY=shared/APPLE_NOTARY_KEY \
            -- bash .github/release/macos-credentials.sh "$RUNNER_TEMP/credentials"
      - name: Sign, notarize, and staple
        run: bash .github/release/opencode-rune-sign-macos.sh "$RUNNER_TEMP/in/build-opencode-rune-macos-arm64/OpenCode-Rune.app.zip" "$RUNNER_TEMP/out"
        env:
          SEER_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          SEER_NOTARY_ISSUER: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
      - name: Remove the credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/credentials/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/credentials"
      - id: upload
        uses: ./.github/release/upload
        with:
          name: sign-opencode-rune-macos
          path: ${{ runner.temp }}/out

  # ---- Verify: repository code on the signed files; no secrets ---------------

  verify-macos:
    needs: [plan, sign-macos]
    if: ${{ !cancelled() && needs.sign-macos.result == 'success' }}
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 30
    env:
      OPENCODE_RUNE_VERSION: ${{ needs.plan.outputs.release-version }}
      OPENCODE_RUNE_BUILD_CHANNEL: ${{ needs.plan.outputs.release-channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/release/download
        with:
          pattern: sign-opencode-rune-macos
          digests: sign-opencode-rune-macos=${{ needs.sign-macos.outputs.digest }}
      - name: Verify signed app, updater zip, and DMG
        run: |
          dmg="$RUNNER_TEMP/in/sign-opencode-rune-macos/OpenCode-Rune-$OPENCODE_RUNE_VERSION-macos-arm64.dmg"
          zip="$RUNNER_TEMP/in/sign-opencode-rune-macos/OpenCode-Rune-$OPENCODE_RUNE_VERSION-macos-arm64.zip"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          check=$(mktemp -d)
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$check/dmg" "$dmg"
          /usr/bin/ditto -x -k "$zip" "$check/update"
          apps/desktop/scripts/validate-app.sh "$check/dmg/OpenCode (Rune).app" "$OPENCODE_RUNE_VERSION" "$OPENCODE_RUNE_BUILD_CHANNEL"
          apps/desktop/scripts/validate-app.sh "$check/update/OpenCode (Rune).app" "$OPENCODE_RUNE_VERSION" "$OPENCODE_RUNE_BUILD_CHANNEL"
          xcrun stapler validate "$check/update/OpenCode (Rune).app"
          codesign --verify --deep --strict -R="$(cat apps/desktop/update-requirement.txt)" "$check/update/OpenCode (Rune).app"
          spctl --assess --type execute --verbose=2 "$check/dmg/OpenCode (Rune).app"
          diff -qr "$check/dmg/OpenCode (Rune).app" "$check/update/OpenCode (Rune).app"
          OPENCODE_RUNE_SMOKE_HEADLESS=1 apps/desktop/scripts/smoke-app.sh "$check/dmg/OpenCode (Rune).app"
          hdiutil detach -quiet "$check/dmg"
          codesign -dv "$check/update/OpenCode (Rune).app" 2>&1 | grep -E '^(Identifier|TeamIdentifier|Authority=Developer)' >> "$GITHUB_STEP_SUMMARY"

  # The publisher every signed file carries must be the one the updater checks, read from the app.
  verify-windows:
    needs: [plan, sign-windows-setup]
    if: ${{ !cancelled() && needs.sign-windows-setup.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      OPENCODE_RUNE_VERSION: ${{ needs.plan.outputs.release-version }}
      OPENCODE_RUNE_BUILD_CHANNEL: ${{ needs.plan.outputs.release-channel }}
      ARCHES: ${{ join(fromJSON(needs.plan.outputs.windows-arches), ' ') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /.github/release/
            /apps/desktop/src/updater/windows.rs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.github/release/download
        with:
          pattern: sign-opencode-rune-windows
          digests: sign-opencode-rune-windows=${{ needs.sign-windows-setup.outputs.digest }}
      - name: Verify the signed install folders and setups
        shell: pwsh
        run: |
          $in = "$env:RUNNER_TEMP/in/sign-opencode-rune-windows"
          $publisher = [regex]::Match((Get-Content -Raw apps/desktop/src/updater/windows.rs), 'pub const EXPECTED_PUBLISHER: &str = "([^"]+)";').Groups[1].Value
          if (-not $publisher) { throw 'Could not read EXPECTED_PUBLISHER from apps/desktop/src/updater/windows.rs.' }
          foreach ($arch in $env:ARCHES -split ' ') {
            foreach ($name in "OpenCode-Rune-$env:OPENCODE_RUNE_VERSION-windows-$arch.zip", "OpenCode-Rune-$env:OPENCODE_RUNE_VERSION-windows-$arch-setup.exe") {
              if (-not (Test-Path -LiteralPath "$in/$name")) { throw "The signed artifact has no $name." }
            }
          }
          .github/release/opencode-rune-verify-windows.ps1 -Folders $in -Publisher $publisher
          $app = Join-Path $env:RUNNER_TEMP 'x64'
          Expand-Archive -LiteralPath "$in/OpenCode-Rune-$env:OPENCODE_RUNE_VERSION-windows-x64.zip" -DestinationPath $app
          $reported = (& "$app/opencode-desktop.exe" --version | Out-String).Trim()
          if ($reported -ne "opencode-rune $env:OPENCODE_RUNE_VERSION ($env:OPENCODE_RUNE_BUILD_CHANNEL)") { throw "opencode-desktop --version reported '$reported'." }
          "Windows: every program, library and setup is signed by $publisher ($reported)." >> $env:GITHUB_STEP_SUMMARY

  # ---- Publish desktop: release environment; OIDC only -----------------------
  # A channel has one current release, and publishing replaces it whole (targets included), so
  # macOS and Windows go out in one release: each platform that's signed and verified this run,
  # and on dev one that isn't never holds the other back. Stable needs both. Only signed builds
  # reach the feed.

  publish-desktop:
    needs: [plan, sign-macos, verify-macos, verify-windows, sign-windows-setup]
    if: >-
      ${{ !cancelled()
      && ((needs.plan.outputs.channel == 'dev'
          && (needs.verify-macos.result == 'success' || needs.verify-windows.result == 'success'))
        || (needs.plan.outputs.channel == 'stable'
          && needs.verify-macos.result == 'success' && needs.verify-windows.result == 'success')) }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE: ${{ needs.plan.outputs.service }}
      VERSION: ${{ needs.plan.outputs.release-version }}
      CHANNEL: ${{ needs.plan.outputs.release-channel }}
      NOTES_URL: ${{ needs.plan.outputs.notes-url }}
      MACOS: ${{ needs.verify-macos.result == 'success' }}
      WINDOWS: ${{ needs.verify-windows.result == 'success' }}
      ARCHES: ${{ join(fromJSON(needs.plan.outputs.windows-arches), ' ') }}
    steps:
      - *checkout-release
      - if: env.MACOS == 'true'
        uses: ./.github/release/download
        with:
          pattern: sign-opencode-rune-macos
          digests: sign-opencode-rune-macos=${{ needs.sign-macos.outputs.digest }}
          folder: macos
      - if: env.WINDOWS == 'true'
        uses: ./.github/release/download
        with:
          pattern: sign-opencode-rune-windows
          digests: sign-opencode-rune-windows=${{ needs.sign-windows-setup.outputs.digest }}
          folder: windows
      - name: Publish OpenCode (Rune) desktop release
        run: |
          targets=()
          if [ "$MACOS" = true ]; then
            dir="$RUNNER_TEMP/macos/sign-opencode-rune-macos"
            targets+=(--target "macos-arm64=$dir/OpenCode-Rune-$VERSION-macos-arm64.zip")
            targets+=(--target "macos-arm64-dmg=$dir/OpenCode-Rune-$VERSION-macos-arm64.dmg")
          fi
          if [ "$WINDOWS" = true ]; then
            dir="$RUNNER_TEMP/windows/sign-opencode-rune-windows"
            for arch in $ARCHES; do
              targets+=(--target "windows-$arch=$dir/OpenCode-Rune-$VERSION-windows-$arch.zip")
              targets+=(--target "windows-$arch-setup=$dir/OpenCode-Rune-$VERSION-windows-$arch-setup.exe")
            done
          fi
          jq -n \
            --arg channel "$CHANNEL" \
            --arg version "$VERSION" \
            --arg notes_url "$NOTES_URL" \
            '{channel: $channel, version: $version, notes_url: $notes_url, distributions: [{kind: "direct"}]}' \
            > "$RUNNER_TEMP/release.json"
          bash .github/release/release-client.sh publish \
            --app opencode \
            --artifact desktop-rune \
            --release "$RUNNER_TEMP/release.json" \
            "${targets[@]}" \
            --out "$RUNNER_TEMP/manifest.json" \
            --verify-downloads
          {
            echo "Published macOS: $MACOS, Windows: $WINDOWS."
            echo '### Desktop Manifest'; echo '```json'; cat "$RUNNER_TEMP/manifest.json"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---- Browser engine: manually published Linux preview ----
  build-engine-linux:
    timeout-minutes: 45
    if: github.ref == 'refs/heads/dev' && inputs.channel == 'engine-linux'
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package Linux x64 CEF sidecar
        run: apps/browser-engine/scripts/package-linux.sh "$RUNNER_TEMP/engine"
      - id: upload
        uses: ./.github/release/upload
        with:
          name: browser-engine-linux-x64
          path: ${{ runner.temp }}/engine

  publish-engine-linux:
    timeout-minutes: 20
    needs: build-engine-linux
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - *checkout-release
      - uses: ./.github/release/download
        with:
          pattern: browser-engine-linux-x64
          digests: browser-engine-linux-x64=${{ needs.build-engine-linux.outputs.digest }}
      - name: Publish versioned Linux engine preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/in/browser-engine-linux-x64"
          tag="browser-engine-linux-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'linux browser engine' --notes 'linux x64 sidecar and installer index' \
            index.json SHA256SUMS OpenCode-Browser-Engine-*-linux-x64.tar.zst

  # ---- Publish Windows dev: rolling GitHub pre-release of the unsigned setups --
  # Every dev build replaces the setups it built on opencode-rune-windows-dev, under names that stay
  # the same, so the download links never change: every push to dev that changes the app.
  # A setup this run didn't build stays, with its line in SHA256SUMS. Signed builds go to the feed
  # too (publish-desktop).
  publish-windows-dev:
    needs: [plan, build-windows]
    if: >-
      ${{ !cancelled()
      && needs.plan.outputs.channel == 'dev'
      && needs.build-windows.outputs.digest-x64 != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.sha }}
      VERSION: ${{ needs.plan.outputs.release-version }}
      RELEASE_TAG: opencode-rune-windows-dev
    steps:
      - *checkout-release
      - uses: ./.github/release/download
        with:
          pattern: build-opencode-rune-windows-*
          digests: >-
            build-opencode-rune-windows-x64=${{ needs.build-windows.outputs.digest-x64 }}
            build-opencode-rune-windows-arm64=${{ needs.build-windows.outputs.digest-arm64 }}
      - name: Replace the setups on the rolling pre-release
        run: |
          mkdir -p "$RUNNER_TEMP/publish" "$RUNNER_TEMP/old"
          built=""
          for arch in x64 arm64; do
            setup="$RUNNER_TEMP/in/build-opencode-rune-windows-$arch/OpenCode-Rune-$VERSION-windows-$arch-setup.exe"
            if [ -f "$setup" ]; then
              cp "$setup" "$RUNNER_TEMP/publish/OpenCode-Rune-windows-$arch-setup.exe"
              built="$built $arch"
            fi
          done
          (cd "$RUNNER_TEMP/publish" && sha256sum -- *.exe > SHA256SUMS)
          exists=false
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exists=true; fi
          # The setups this run didn't build stay, and so do their checksums.
          if [ "$exists" = true ] && gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP/old" 2>/dev/null; then
            while read -r sum name; do
              [ -f "$RUNNER_TEMP/publish/$name" ] || printf '%s  %s\n' "$sum" "$name" >> "$RUNNER_TEMP/publish/SHA256SUMS"
            done < "$RUNNER_TEMP/old/SHA256SUMS"
          fi
          title="OpenCode (Rune) for Windows, dev ($VERSION)"
          notes="Unsigned Windows setups from dev, rebuilt on every push that changes the app. This update:$built @ ${SHA:0:9} ($VERSION). SHA256SUMS covers every setup here. Windows SmartScreen warns about unsigned apps: choose More info, then Run anyway."

          if [ "$exists" = true ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" -f sha="$SHA" -F force=true >/dev/null
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/publish/* --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --prerelease --title "$title" --notes "$notes"
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/publish/* -R "$GITHUB_REPOSITORY" \
              --target "$SHA" --prerelease --title "$title" --notes "$notes"
          fi

          for file in "$RUNNER_TEMP"/publish/*.exe; do
            echo "Published https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$(basename "$file")" >> "$GITHUB_STEP_SUMMARY"
          done

  # ---- Tag and GitHub release: last, once the release service published ------
  # Tags v<version> on the released commit and mirrors the signed files to its GitHub release, with
  # the built-in token; a failed run leaves no tag. Tags start nothing. A check run pushes and
  # deletes a throwaway v0.0.0-test-<run> tag to prove the token can tag.

  github:
    name: Tag and GitHub release
    needs: [plan, publish-desktop, sign-macos, verify-macos, sign-windows-setup, verify-windows]
    if: >-
      ${{ !cancelled() && (
        (needs.plan.outputs.channel == 'stable' && needs.publish-desktop.result == 'success')
        || (needs.plan.outputs.channel == 'check' && needs.verify-windows.result == 'success'
            && (needs.verify-macos.result == 'success' || needs.plan.outputs.macos != 'true'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SHA: ${{ github.sha }}
      VERSION: ${{ needs.plan.outputs.release-version }}
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Credentials stay so the job can push the tag; it runs nothing beyond .github/release/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: /.github/release/
          sparse-checkout-cone-mode: false
      - name: Tag
        env:
          TAG_TEST: ${{ needs.plan.outputs.channel == 'check' && '1' || '' }}
        run: bash .github/release/tag-release.sh
      - if: needs.plan.outputs.channel == 'stable'
        uses: ./.github/release/download
        with:
          pattern: sign-opencode-rune-macos
          digests: sign-opencode-rune-macos=${{ needs.sign-macos.outputs.digest }}
          folder: macos
      - if: needs.plan.outputs.channel == 'stable'
        uses: ./.github/release/download
        with:
          pattern: sign-opencode-rune-windows
          digests: sign-opencode-rune-windows=${{ needs.sign-windows-setup.outputs.digest }}
          folder: windows
      - name: GitHub release
        if: needs.plan.outputs.channel == 'stable'
        run: bash .github/release/publish-github-release.sh "$RUNNER_TEMP/macos/sign-opencode-rune-macos" "$RUNNER_TEMP/windows/sign-opencode-rune-windows"
