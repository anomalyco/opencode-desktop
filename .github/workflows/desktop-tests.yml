name: Desktop tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  desktop-tests:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --locked -p opencode-desktop
