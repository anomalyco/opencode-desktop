name: Desktop tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  desktop-tests:
    name: Desktop and session-view tests
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked --no-fail-fast -p session-view -p opencode-desktop -- --skip motion_gate

  motion-gate:
    name: Motion gate
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked --no-fail-fast -p opencode-desktop -- motion_gate
