name: OpenCode (Rune) Release

# Builds, signs, notarizes, and publishes OpenCode (Rune) (apps/desktop) and its
# Browser Engine sidecar to https://anoma.ly/release (docs/releasing.md).
#
# Security boundary mirrors .github/workflows/release.yml:
# - build and verify jobs run repository code with no environment, secrets, or id-token.
# - sign and publish jobs run in the `release` environment, check out only
#   /.github/release/, and treat artifacts strictly as SHA-256-verified data.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag, or branch to build
        required: true
        default: main
      channel:
        description: check (build, sign, verify; publish nothing), dev (publish dev from main), or stable (publish from opencode-rune-v* tag)
        type: choice
        options: [check, dev, stable]
        default: check
  push:
    branches: [main]
    tags: ["opencode-rune-v*", "browser-engine-*"]
    paths:
      - "apps/desktop/**"
      - "apps/installer/**"
      - "crates/browser-pane/**"
      - "crates/hex-client/**"
      - "crates/opencode-i18n/**"
      - "crates/opencode-kit/**"
      - "crates/opencode-plugin-spec/**"
      - "crates/otlp-lite/**"
      - "crates/project-icon/**"
      - "crates/rune-parts/**"
      - "crates/session-view/**"
      - "crates/terminal/**"
      - "crates/win-install/**"
      - "plugins/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/opencode-rune-release.yml"
      - ".github/release/**"

permissions:
  contents: read

concurrency:
  group: opencode-rune-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', inputs.channel) || github.ref_type == 'tag' && format('tag-{0}', github.ref_name) || 'main-dev' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SEER_TEAM_ID: 5NZ4Q7NXJ4

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      channel: ${{ steps.plan.outputs.channel }}
      service: ${{ steps.plan.outputs.service }}
      tag: ${{ steps.plan.outputs.tag }}
      notes-url: ${{ steps.plan.outputs.notes-url }}
      release-channel: ${{ steps.plan.outputs.release-channel }}
      release-version: ${{ steps.plan.outputs.release-version }}
      build-desktop: ${{ steps.plan.outputs.build-desktop }}
      publish-engine: ${{ steps.plan.outputs.publish-engine }}
      engine-version: ${{ steps.plan.outputs.engine-version }}
      engine-release-version: ${{ steps.plan.outputs.engine-release-version }}
      engine-sha256: ${{ steps.plan.outputs.engine-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          sparse-checkout: |
            /.github/release/
            /apps/desktop/Cargo.toml
            /crates/browser-pane/src/installer.rs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: plan
        run: SHA=$(git rev-parse HEAD) bash .github/release/opencode-rune-plan.sh
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}
          CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || github.ref_type == 'tag' && 'stable' || 'dev' }}

  # ---- Build: repository code; no environment, secrets, or id-token ----------

  build-macos:
    needs: plan
    if: ${{ needs.plan.outputs.build-desktop == 'true' }}
    runs-on: macos-26
    timeout-minutes: 120
    env:
      OPENCODE_RUNE_VERSION: ${{ needs.plan.outputs.release-version }}
      OPENCODE_RUNE_BUILD_CHANNEL: ${{ needs.plan.outputs.release-channel }}
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      # rust-toolchain.toml picks the toolchain.
      - name: Rust toolchain
        run: rustup toolchain install
      - name: Build OpenCode (Rune).app
        run: |
          apps/desktop/scripts/set-crate-version.sh "$PWD" "$OPENCODE_RUNE_VERSION"
          mkdir -p "$RUNNER_TEMP/app" "$RUNNER_TEMP/macos"
          apps/desktop/scripts/build-app.sh "$RUNNER_TEMP/app"
          OPENCODE_RUNE_SMOKE_HEADLESS=1 apps/desktop/scripts/smoke-app.sh "$RUNNER_TEMP/app/OpenCode (Rune).app"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/app/OpenCode (Rune).app" "$RUNNER_TEMP/macos/OpenCode-Rune.app.zip"
      - id: upload
        uses: ./.github/release/upload
        with:
          name: build-opencode-rune-macos-arm64
          path: ${{ runner.temp }}/macos
          retention-days: "7"

  build-windows:
    needs: plan
    if: ${{ needs.plan.outputs.build-desktop == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      OPENCODE_RUNE_VERSION: ${{ needs.plan.outputs.release-version }}
      OPENCODE_RUNE_BUILD_CHANNEL: ${{ needs.plan.outputs.release-channel }}
    # One output per arch: a matrix job's outputs are shared by its legs.
    outputs:
      digest-x64: ${{ steps.digest.outputs.digest-x64 }}
      digest-arm64: ${{ steps.digest.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      # rust-toolchain.toml picks the toolchain; arm64 cross-builds on the x64 runner.
      - name: Rust toolchain
        run: |
          rustup toolchain install
          [ "${{ matrix.arch }}" = x64 ] || rustup target add aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The terminal's libghostty-vt, and the Zig that builds it, live outside target/.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/seer/ghostty-vt
          key: ghostty-vt-windows-${{ matrix.arch }}-${{ hashFiles('crates/terminal/build.rs', 'crates/terminal/build_support.rs') }}
      - name: Build the setup and the update zip
        shell: pwsh
        run: apps/installer/scripts/package.ps1 -Out "$env:RUNNER_TEMP/windows" -Arch ${{ matrix.arch }}
      - id: upload
        uses: ./.github/release/upload
        with:
          name: build-opencode-rune-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/windows
          retention-days: "7"
      - id: digest
        run: echo "digest-${{ matrix.arch }}=${{ steps.upload.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # The setup around the install folder sign-windows signed, so it installs the same signed files
  # the updater downloads. Repository code: a build, after the signing job (as OpenCode's
  # build-desktop-windows-installer); sign-windows-setup signs the setup next.
  package-windows:
    needs: [plan, sign-windows]
    if: ${{ !cancelled() && needs.sign-windows.outputs.signed == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      OPENCODE_RUNE_VERSION: ${{ needs.plan.outputs.release-version }}
      OPENCODE_RUNE_BUILD_CHANNEL: ${{ needs.plan.outputs.release-channel }}
    outputs:
      digest-x64: ${{ steps.digest.outputs.digest-x64 }}
      digest-arm64: ${{ steps.digest.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install
          [ "${{ matrix.arch }}" = x64 ] || rustup target add aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-setup-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/release/download
        with:
          pattern: sign-opencode-rune-windows-app
          digests: sign-opencode-rune-windows-app=${{ needs.sign-windows.outputs.digest }}
      - name: Build the setup around the signed zip
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/in/sign-opencode-rune-windows-app/OpenCode-Rune-$env:OPENCODE_RUNE_VERSION-windows-${{ matrix.arch }}.zip"
          apps/installer/scripts/package.ps1 -Out "$env:RUNNER_TEMP/setup" -Arch ${{ matrix.arch }} -Payload $zip
      - id: upload
        uses: ./.github/release/upload
        with:
          name: build-opencode-rune-windows-setup-${{ matrix.arch }}
          path: ${{ runner.temp }}/setup
          retention-days: "7"
      - id: digest
        run: echo "digest-${{ matrix.arch }}=${{ steps.upload.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # ---- Sign: release environment; only .github/release/ is checked out -------

  # Authenticode-signs opencode-desktop.exe and every program and library of both install folders
  # through Azure Artifact Signing, as OpenCode's and Hex's release workflows do (GitHub OIDC into
  # the release environment's AZURE_* values), then zips the signed folders: the updater's
  # windows-<arch> targets, which it checks against updater::windows::EXPECTED_PUBLISHER.
  # package-windows builds the setups around those zips and sign-windows-setup signs them.
  # Without the Azure values, dev and check go on without Windows in the feed; stable fails.
  sign-windows:
    needs: [plan, build-windows]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.build-desktop == 'true'
      && needs.plan.outputs.channel != 'pr-check'
      && needs.build-windows.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    env: &windows-sign-env
      CHANNEL: ${{ needs.plan.outputs.channel }}
      VERSION: ${{ needs.plan.outputs.release-version }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT || secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME || secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE || secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
    outputs:
      signed: ${{ steps.credentials.outputs.available }}
      digest: ${{ steps.upload.outputs.digest }}
    steps:
      - &checkout-release
        name: Check out the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          sparse-checkout: /.github/release/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - &azure-credentials
        id: credentials
        name: Require the Azure values
        run: |
          missing=
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_TRUSTED_SIGNING_ENDPOINT \
            AZURE_TRUSTED_SIGNING_ACCOUNT_NAME AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$CHANNEL" = stable ]; then
            echo "::error::Stable releases need signed Windows builds, and the release environment lacks:$missing."
            exit 1
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Authenticode signing, so no Windows targets in the feed: the release environment lacks$missing. The unsigned setups still go to the rolling pre-release (dev)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Download the unsigned builds
        if: steps.credentials.outputs.available == 'true'
        uses: ./.github/release/download
        with:
          pattern: build-opencode-rune-windows-*
          digests: >-
            build-opencode-rune-windows-x64=${{ needs.build-windows.outputs.digest-x64 }}
            build-opencode-rune-windows-arm64=${{ needs.build-windows.outputs.digest-arm64 }}
      - name: Unpack the install folders
        if: steps.credentials.outputs.available == 'true'
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'arm64') {
            Expand-Archive -LiteralPath "$env:RUNNER_TEMP/in/build-opencode-rune-windows-$arch/OpenCode-Rune-$env:VERSION-windows-$arch.zip" -DestinationPath "$env:RUNNER_TEMP/work/windows-$arch"
          }
      - &azure-login
        name: Sign in to Azure
        if: steps.credentials.outputs.available == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - &azure-sign
        name: Sign
        if: steps.credentials.outputs.available == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ env.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ runner.temp }}\work
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: OpenCode (Rune)
          description-url: https://github.com/anomalyco/rune-desktop
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - &azure-verify
        name: Check the signatures
        if: steps.credentials.outputs.available == 'true'
        shell: pwsh
        run: .github/release/opencode-rune-verify-windows.ps1 -Folders "$env:RUNNER_TEMP/work"
      - name: Zip the signed install folders
        if: steps.credentials.outputs.available == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/out" | Out-Null
          foreach ($arch in 'x64', 'arm64') {
            Compress-Archive -Path "$env:RUNNER_TEMP/work/windows-$arch/*" -DestinationPath "$env:RUNNER_TEMP/out/OpenCode-Rune-$env:VERSION-windows-$arch.zip"
          }
      - id: upload
        if: steps.credentials.outputs.available == 'true'
        uses: ./.github/release/upload
        with:
          name: sign-opencode-rune-windows-app
          path: ${{ runner.temp }}/out

  sign-windows-setup:
    needs: [plan, sign-windows, package-windows]
    if: ${{ !cancelled() && needs.sign-windows.outputs.signed == 'true' && needs.package-windows.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    env: *windows-sign-env
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    steps:
      - *checkout-release
      - *azure-credentials
      - name: Download the setups
        uses: ./.github/release/download
        with:
          pattern: build-opencode-rune-windows-setup-*
          digests: >-
            build-opencode-rune-windows-setup-x64=${{ needs.package-windows.outputs.digest-x64 }}
            build-opencode-rune-windows-setup-arm64=${{ needs.package-windows.outputs.digest-arm64 }}
      - name: Download the signed zips
        uses: ./.github/release/download
        with:
          pattern: sign-opencode-rune-windows-app
          digests: sign-opencode-rune-windows-app=${{ needs.sign-windows.outputs.digest }}
          folder: app
      - name: Gather the setups
        run: |
          temp=$(cygpath -u "$RUNNER_TEMP")
          mkdir -p "$temp/work" && cp "$temp"/in/build-opencode-rune-windows-setup-*/*.exe "$temp/work/"
      - *azure-login
      - *azure-sign
      - *azure-verify
      - name: Gather the release files
        run: |
          temp=$(cygpath -u "$RUNNER_TEMP")
          mkdir -p "$temp/out" && cp "$temp"/work/*.exe "$temp"/app/sign-opencode-rune-windows-app/*.zip "$temp/out/"
      - id: upload
        uses: ./.github/release/upload
        with:
          name: sign-opencode-rune-windows
          path: ${{ runner.temp }}/out

  sign-macos:
    needs: [plan, build-macos]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.build-desktop == 'true'
      && needs.plan.outputs.channel != 'pr-check'
      && needs.build-macos.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    env:
      OPENCODE_RUNE_VERSION: ${{ needs.plan.outputs.release-version }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
    outputs:
      signed: ${{ steps.credentials.outputs.available }}
      digest: ${{ steps.upload.outputs.digest }}
    steps:
      - *checkout-release
      - id: credentials
        name: Require the Apple values
        env:
          CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
          KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID || secrets.APPLE_NOTARY_KEY_ID }}
          ISSUER: ${{ vars.APPLE_NOTARY_ISSUER_ID || secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          missing=
          [ -n "$CERTIFICATE" ] || missing="$missing APPLE_SIGNING_CERTIFICATE"
          [ -n "$KEY" ] || missing="$missing APPLE_NOTARY_KEY"
          [ -n "$KEY_ID" ] || missing="$missing APPLE_NOTARY_KEY_ID"
          [ -n "$ISSUER" ] || missing="$missing APPLE_NOTARY_ISSUER_ID"
          if [ -z "$missing" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$CHANNEL" = stable ]; then
            echo "::error::Stable releases require Apple signing credentials; missing:$missing."
            exit 1
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Developer ID signing: release environment lacks:$missing." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Download unsigned app
        if: steps.credentials.outputs.available == 'true'
        uses: ./.github/release/download
        with:
          pattern: build-opencode-rune-macos-arm64
          digests: build-opencode-rune-macos-arm64=${{ needs.build-macos.outputs.digest }}
      - name: Import the certificate and notary key
        if: steps.credentials.outputs.available == 'true'
        run: bash .github/release/macos-credentials.sh "$RUNNER_TEMP/credentials"
        env:
          APPLE_SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      - name: Sign, notarize, and staple
        if: steps.credentials.outputs.available == 'true'
        run: bash .github/release/opencode-rune-sign-macos.sh "$RUNNER_TEMP/in/build-opencode-rune-macos-arm64/OpenCode-Rune.app.zip" "$RUNNER_TEMP/out"
        env:
          SEER_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID || secrets.APPLE_NOTARY_KEY_ID }}
          SEER_NOTARY_ISSUER: ${{ vars.APPLE_NOTARY_ISSUER_ID || secrets.APPLE_NOTARY_ISSUER_ID }}
      - name: Remove the credentials
        if: always() && steps.credentials.outputs.available == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/credentials/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/credentials"
      - id: upload
        if: steps.credentials.outputs.available == 'true'
        uses: ./.github/release/upload
        with:
          name: sign-opencode-rune-macos
          path: ${{ runner.temp }}/out

  # ---- Verify: repository code on the signed files; no secrets ---------------

  verify-macos:
    needs: [plan, sign-macos]
    if: ${{ !cancelled() && needs.sign-macos.result == 'success' && needs.sign-macos.outputs.signed == 'true' }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      OPENCODE_RUNE_VERSION: ${{ needs.plan.outputs.release-version }}
      OPENCODE_RUNE_BUILD_CHANNEL: ${{ needs.plan.outputs.release-channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/release/download
        with:
          pattern: sign-opencode-rune-macos
          digests: sign-opencode-rune-macos=${{ needs.sign-macos.outputs.digest }}
      - name: Verify signed app, updater zip, and DMG
        run: |
          dmg="$RUNNER_TEMP/in/sign-opencode-rune-macos/OpenCode-Rune-$OPENCODE_RUNE_VERSION-macos-arm64.dmg"
          zip="$RUNNER_TEMP/in/sign-opencode-rune-macos/OpenCode-Rune-$OPENCODE_RUNE_VERSION-macos-arm64.zip"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          check=$(mktemp -d)
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$check/dmg" "$dmg"
          /usr/bin/ditto -x -k "$zip" "$check/update"
          apps/desktop/scripts/validate-app.sh "$check/dmg/OpenCode (Rune).app" "$OPENCODE_RUNE_VERSION" "$OPENCODE_RUNE_BUILD_CHANNEL"
          apps/desktop/scripts/validate-app.sh "$check/update/OpenCode (Rune).app" "$OPENCODE_RUNE_VERSION" "$OPENCODE_RUNE_BUILD_CHANNEL"
          xcrun stapler validate "$check/update/OpenCode (Rune).app"
          codesign --verify --deep --strict -R="$(cat apps/desktop/update-requirement.txt)" "$check/update/OpenCode (Rune).app"
          spctl --assess --type execute --verbose=2 "$check/dmg/OpenCode (Rune).app"
          diff -qr "$check/dmg/OpenCode (Rune).app" "$check/update/OpenCode (Rune).app"
          OPENCODE_RUNE_SMOKE_HEADLESS=1 apps/desktop/scripts/smoke-app.sh "$check/dmg/OpenCode (Rune).app"
          hdiutil detach -quiet "$check/dmg"
          codesign -dv "$check/update/OpenCode (Rune).app" 2>&1 | grep -E '^(Identifier|TeamIdentifier|Authority=Developer)' >> "$GITHUB_STEP_SUMMARY"

  # The publisher every signed file carries must be the one the updater checks, read from the app.
  verify-windows:
    needs: [plan, sign-windows-setup]
    if: ${{ !cancelled() && needs.sign-windows-setup.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      OPENCODE_RUNE_VERSION: ${{ needs.plan.outputs.release-version }}
      OPENCODE_RUNE_BUILD_CHANNEL: ${{ needs.plan.outputs.release-channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          sparse-checkout: |
            /.github/release/
            /apps/desktop/src/updater/windows.rs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.github/release/download
        with:
          pattern: sign-opencode-rune-windows
          digests: sign-opencode-rune-windows=${{ needs.sign-windows-setup.outputs.digest }}
      - name: Verify the signed install folders and setups
        shell: pwsh
        run: |
          $in = "$env:RUNNER_TEMP/in/sign-opencode-rune-windows"
          $publisher = [regex]::Match((Get-Content -Raw apps/desktop/src/updater/windows.rs), 'pub const EXPECTED_PUBLISHER: &str = "([^"]+)";').Groups[1].Value
          if (-not $publisher) { throw 'Could not read EXPECTED_PUBLISHER from apps/desktop/src/updater/windows.rs.' }
          foreach ($arch in 'x64', 'arm64') {
            foreach ($name in "OpenCode-Rune-$env:OPENCODE_RUNE_VERSION-windows-$arch.zip", "OpenCode-Rune-$env:OPENCODE_RUNE_VERSION-windows-$arch-setup.exe") {
              if (-not (Test-Path -LiteralPath "$in/$name")) { throw "The signed artifact has no $name." }
            }
          }
          .github/release/opencode-rune-verify-windows.ps1 -Folders $in -Publisher $publisher
          $app = Join-Path $env:RUNNER_TEMP 'x64'
          Expand-Archive -LiteralPath "$in/OpenCode-Rune-$env:OPENCODE_RUNE_VERSION-windows-x64.zip" -DestinationPath $app
          $reported = (& "$app/opencode-desktop.exe" --version | Out-String).Trim()
          if ($reported -ne "opencode-rune $env:OPENCODE_RUNE_VERSION ($env:OPENCODE_RUNE_BUILD_CHANNEL)") { throw "opencode-desktop --version reported '$reported'." }
          "Windows: every program, library and setup is signed by $publisher ($reported)." >> $env:GITHUB_STEP_SUMMARY

  # ---- Publish desktop: release environment; OIDC only -----------------------
  # A channel has one current release, and publishing replaces it whole (targets included), so
  # macOS and Windows go out in one release: each platform that's signed and verified this run,
  # and one that isn't never holds the other back. Only signed Windows builds reach the feed.

  publish-desktop:
    needs: [plan, sign-macos, verify-macos, verify-windows, sign-windows-setup]
    if: >-
      ${{ !cancelled()
      && (needs.plan.outputs.channel == 'dev' || needs.plan.outputs.channel == 'stable')
      && ((needs.sign-macos.outputs.signed == 'true' && needs.verify-macos.result == 'success')
        || needs.verify-windows.result == 'success') }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE: ${{ needs.plan.outputs.service }}
      VERSION: ${{ needs.plan.outputs.release-version }}
      CHANNEL: ${{ needs.plan.outputs.release-channel }}
      NOTES_URL: ${{ needs.plan.outputs.notes-url }}
      MACOS: ${{ needs.sign-macos.outputs.signed == 'true' && needs.verify-macos.result == 'success' }}
      WINDOWS: ${{ needs.verify-windows.result == 'success' }}
    steps:
      - *checkout-release
      - if: env.MACOS == 'true'
        uses: ./.github/release/download
        with:
          pattern: sign-opencode-rune-macos
          digests: sign-opencode-rune-macos=${{ needs.sign-macos.outputs.digest }}
          folder: macos
      - if: env.WINDOWS == 'true'
        uses: ./.github/release/download
        with:
          pattern: sign-opencode-rune-windows
          digests: sign-opencode-rune-windows=${{ needs.sign-windows-setup.outputs.digest }}
          folder: windows
      - name: Publish OpenCode (Rune) desktop release
        run: |
          targets=()
          if [ "$MACOS" = true ]; then
            dir="$RUNNER_TEMP/macos/sign-opencode-rune-macos"
            targets+=(--target "macos-arm64=$dir/OpenCode-Rune-$VERSION-macos-arm64.zip")
            targets+=(--target "macos-arm64-dmg=$dir/OpenCode-Rune-$VERSION-macos-arm64.dmg")
          fi
          if [ "$WINDOWS" = true ]; then
            dir="$RUNNER_TEMP/windows/sign-opencode-rune-windows"
            for arch in x64 arm64; do
              targets+=(--target "windows-$arch=$dir/OpenCode-Rune-$VERSION-windows-$arch.zip")
              targets+=(--target "windows-$arch-setup=$dir/OpenCode-Rune-$VERSION-windows-$arch-setup.exe")
            done
          fi
          jq -n \
            --arg channel "$CHANNEL" \
            --arg version "$VERSION" \
            --arg notes_url "$NOTES_URL" \
            '{channel: $channel, version: $version, notes_url: $notes_url, distributions: [{kind: "direct"}]}' \
            > "$RUNNER_TEMP/release.json"
          bash .github/release/release-client.sh publish \
            --app opencode-rune \
            --artifact desktop \
            --release "$RUNNER_TEMP/release.json" \
            "${targets[@]}" \
            --out "$RUNNER_TEMP/manifest.json" \
            --verify-downloads
          {
            echo "Published macOS: $MACOS, Windows: $WINDOWS."
            echo '### Desktop Manifest'; echo '```json'; cat "$RUNNER_TEMP/manifest.json"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---- Publish Windows dev: rolling GitHub pre-release of the unsigned setups --
  # Every main build replaces the setups on opencode-rune-windows-dev, under names that stay the
  # same, so the download links never change. Signed builds go to the feed too (publish-desktop).

  publish-windows-dev:
    needs: [plan, build-windows]
    if: >-
      ${{ !cancelled()
      && needs.plan.outputs.channel == 'dev'
      && needs.build-windows.outputs.digest-x64 != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.plan.outputs.sha }}
      VERSION: ${{ needs.plan.outputs.release-version }}
      RELEASE_TAG: opencode-rune-windows-dev
    steps:
      - *checkout-release
      - uses: ./.github/release/download
        with:
          pattern: build-opencode-rune-windows-*
          digests: >-
            build-opencode-rune-windows-x64=${{ needs.build-windows.outputs.digest-x64 }}
            build-opencode-rune-windows-arm64=${{ needs.build-windows.outputs.digest-arm64 }}
      - name: Replace the setups on the rolling pre-release
        run: |
          mkdir -p "$RUNNER_TEMP/publish"
          for arch in x64 arm64; do
            setup="$RUNNER_TEMP/in/build-opencode-rune-windows-$arch/OpenCode-Rune-$VERSION-windows-$arch-setup.exe"
            if [ -f "$setup" ]; then cp "$setup" "$RUNNER_TEMP/publish/OpenCode-Rune-windows-$arch-setup.exe"; fi
          done
          (cd "$RUNNER_TEMP/publish" && sha256sum -- *.exe > SHA256SUMS)
          title="OpenCode (Rune) for Windows, dev ($VERSION)"
          notes="Unsigned Windows setup built from main @ ${SHA:0:9} ($VERSION). Replaced on every push to main. Windows SmartScreen warns about unsigned apps: choose More info, then Run anyway."

          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" -f sha="$SHA" -F force=true >/dev/null
            # An arch that didn't build this time loses its old setup rather than keep a stale one.
            gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while IFS= read -r name; do
              [ -f "$RUNNER_TEMP/publish/$name" ] || gh release delete-asset "$RELEASE_TAG" "$name" --yes -R "$GITHUB_REPOSITORY"
            done
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/publish/* --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --prerelease --title "$title" --notes "$notes"
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/publish/* -R "$GITHUB_REPOSITORY" \
              --target "$SHA" --prerelease --title "$title" --notes "$notes"
          fi

          for file in "$RUNNER_TEMP"/publish/*.exe; do
            echo "Published https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$(basename "$file")" >> "$GITHUB_STEP_SUMMARY"
          done

  # ---- Publish Browser Engine: public download on https://anoma.ly/release ---
  # TODO(IMPORTANT before release): build + sign (Authenticode) the Windows engine in CI with package-release.ps1, upload to the release CDN, then set ENGINE_DEFAULT_URL/SHA256 here.
  # (Here: a windows-x64 target beside macos-arm64 below, and the constants in
  # crates/browser-pane/src/installer.rs, which this workflow and opencode-rune-plan.sh read.)

  fetch-browser-engine:
    needs: plan
    if: ${{ needs.plan.outputs.publish-engine == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      needed: ${{ steps.check.outputs.needed }}
      digest: ${{ steps.upload.outputs.digest }}
    steps:
      - *checkout-release
      - id: check
        name: Check if Browser Engine is already published on anoma.ly/release
        env:
          RELEASE: ${{ needs.plan.outputs.service }}
          ENGINE_VERSION: ${{ needs.plan.outputs.engine-version }}
          ENGINE_RELEASE_VERSION: ${{ needs.plan.outputs.engine-release-version }}
          ENGINE_SHA256: ${{ needs.plan.outputs.engine-sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          manifest_url="$RELEASE/opencode-rune/browser-engine/stable.json"
          name="OpenCode-Browser-Engine-$ENGINE_VERSION-macos-arm64.zip"
          if manifest=$(curl -fsS "$manifest_url" 2>/dev/null) &&
             [ "$(printf '%s' "$manifest" | jq -r '.release.version // empty')" = "$ENGINE_RELEASE_VERSION" ] &&
             [ "$(printf '%s' "$manifest" | jq -r '.release.targets["macos-arm64"].sha256 // empty')" = "$ENGINE_SHA256" ] &&
             curl -fsSI "$RELEASE/opencode-rune/files/$ENGINE_SHA256/$name" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Browser Engine $ENGINE_VERSION ($ENGINE_SHA256) is already live on $manifest_url." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/engine"
          gh release download "browser-engine-$ENGINE_VERSION" -R "$GITHUB_REPOSITORY" \
            --pattern "$name" --dir "$RUNNER_TEMP/engine" --clobber
          actual=$(sha256sum "$RUNNER_TEMP/engine/$name" | awk '{ print $1 }')
          if [ "$actual" != "$ENGINE_SHA256" ]; then
            echo "::error::Downloaded $name sha256 ($actual) did not match pinned $ENGINE_SHA256."
            exit 1
          fi
      - id: upload
        if: steps.check.outputs.needed == 'true'
        uses: ./.github/release/upload
        with:
          name: browser-engine-macos-arm64
          path: ${{ runner.temp }}/engine
          retention-days: "1"

  publish-browser-engine:
    needs: [plan, fetch-browser-engine]
    if: >-
      ${{ !cancelled()
      && needs.plan.outputs.publish-engine == 'true'
      && needs.fetch-browser-engine.result == 'success'
      && needs.fetch-browser-engine.outputs.needed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE: ${{ needs.plan.outputs.service }}
      ENGINE_VERSION: ${{ needs.plan.outputs.engine-version }}
      ENGINE_RELEASE_VERSION: ${{ needs.plan.outputs.engine-release-version }}
      ENGINE_SHA256: ${{ needs.plan.outputs.engine-sha256 }}
    steps:
      - *checkout-release
      - uses: ./.github/release/download
        with:
          pattern: browser-engine-macos-arm64
          digests: browser-engine-macos-arm64=${{ needs.fetch-browser-engine.outputs.digest }}
      - name: Publish Browser Engine to anoma.ly/release
        run: |
          name="OpenCode-Browser-Engine-$ENGINE_VERSION-macos-arm64.zip"
          zip="$RUNNER_TEMP/in/browser-engine-macos-arm64/$name"
          notes="https://github.com/$GITHUB_REPOSITORY/releases/tag/browser-engine-$ENGINE_VERSION"
          jq -n \
            --arg version "$ENGINE_RELEASE_VERSION" \
            --arg notes_url "$notes" \
            '{channel: "stable", version: $version, allow_prerelease: true, notes_url: $notes_url, distributions: [{kind: "direct"}]}' \
            > "$RUNNER_TEMP/engine-release.json"
          bash .github/release/release-client.sh publish \
            --app opencode-rune \
            --artifact browser-engine \
            --release "$RUNNER_TEMP/engine-release.json" \
            --target "macos-arm64=$zip" \
            --out "$RUNNER_TEMP/engine-manifest.json" \
            --verify-downloads
          { echo '### Browser Engine Manifest'; echo '```json'; cat "$RUNNER_TEMP/engine-manifest.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
